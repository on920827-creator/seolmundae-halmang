<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문대할망 · 제주를 빚은 거인</title>
<style>
  :root{--bg:#12113a;--ink:#f1efff;--mute:#a7a4d3;--acc:#a98bff;--acc2:#7a5bd8;--line:rgba(255,255,255,.13);--mint:#8fe3c8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#26236e 0%,#1a1852 38%,#12113a 100%) fixed;color:var(--ink);min-height:100vh;
       font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.7;display:flex;justify-content:center;padding:0 0 40px}
  main{width:100%;max-width:760px}
  /* ── 위쪽 줄: 뒤로가기·제목·칩 ── */
  .bar{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}
  .bgmbtn{position:fixed;right:14px;bottom:14px;z-index:60;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(240,214,150,.75);background:rgba(26,22,80,.82);color:#f3efff;cursor:pointer;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .15s,background .2s}
  .bgmbtn:hover{transform:scale(1.07);background:rgba(60,50,150,.9)} .bgmbtn:focus-visible{outline:3px solid #8fe3c8;outline-offset:2px}
  .bgmbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .bgmbtn.off{color:#a9a1e0}
  /* 언어 선택 (오른쪽 위 지구본 버튼) */
  .langbox{position:relative;flex:none;margin-left:6px}
  .langbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;border-radius:999px;border:1px solid rgba(169,139,255,.5);background:rgba(26,22,80,.55);color:#f3efff;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .langbtn:hover{background:rgba(60,50,150,.75)} .langbtn:focus-visible{outline:3px solid #8fe3c8;outline-offset:2px}
  .langbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .langmenu{position:absolute;right:0;top:40px;z-index:80;margin:0;padding:6px;list-style:none;min-width:130px;border-radius:14px;border:1px solid rgba(240,214,150,.6);background:rgba(26,22,80,.96);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .langmenu[hidden]{display:none}
  .langmenu button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;border-radius:10px;background:none;color:#f3efff;font:inherit;font-size:.9rem;cursor:pointer}
  .langmenu button:hover,.langmenu button:focus-visible{background:rgba(169,139,255,.25);outline:none} .langmenu button.on{color:#8fe3c8;font-weight:700}
  /* 일본어·중국어는 띄어쓰기가 없어 한국어용 '낱말 단위 줄바꿈'을 풀고, 글꼴도 맞춘다 */
  html[lang="ja"] *,html[lang="zh"] *{word-break:normal!important;overflow-wrap:anywhere;line-break:strict}
  html[lang="ja"] body{font-family:"Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP","Malgun Gothic",sans-serif}
  html[lang="zh"] body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Malgun Gothic",sans-serif}
  html[lang="en"] #text p{word-break:normal!important}
  html:not([lang="ko"]) .tapnote{white-space:normal;border-radius:18px;line-height:1.35}   /* 영어는 안내 글이 길어서 줄을 바꿔 보여 준다 */
  @media(max-width:420px){.bar h2{font-size:.95rem}.langbtn span{display:none}.langbtn{padding:0 9px}}
  .vcbtn{right:68px} .vcbtn[hidden]{display:none}
  .back{width:36px;height:36px;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;border-radius:50%;flex:none}
  .back[hidden]{display:grid;visibility:hidden} .back:hover{background:rgba(255,255,255,.12)} .back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .bar h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px 14px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;color:#d9d4ff;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 11px;transition:.3s}
  .chip svg{width:16px;height:16px;fill:currentColor} .chip b{font-weight:700;color:#fff}
  .chip.on{background:rgba(169,139,255,.24);border-color:rgba(169,139,255,.65);color:#fff}
  .found{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:.86rem;color:#d9d4ff;padding-left:12px;border-left:1px solid var(--line)}
  .found svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round} .found b{color:#fff;font-weight:700} .found b.acc{color:var(--acc)}
  /* ── 무대 ── */
  #stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0b0a26;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
  @media(max-width:640px){#stage{aspect-ratio:4/3}}
  #stage svg{position:absolute;inset:0;width:100%;height:100%;animation:fadein 1.4s ease both}
  @keyframes fadein{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
  .vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(10,8,40,.45) 100%)}
  .grain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .bgwrap{position:absolute;inset:0;overflow:hidden;animation:fadein 1.4s ease both;transform:translate(calc(var(--mx,0)*-9px),calc(var(--my,0)*-4px));transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .bgwrap img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transform-origin:50% 30%;animation:kb 28s ease-in-out infinite alternate}
  .bgwrap video{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;pointer-events:none}   /* 움직이는 그림(mp4)은 그림 자체가 움직이므로 천천히 확대하는 효과는 쓰지 않는다 */
  @keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.07) translate(-.8%,0)}}
  .chapter{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
    text-shadow:0 2px 24px #000;animation:chap 3.6s ease both;opacity:0}
  .chapter small{letter-spacing:.5em;color:#d9ccff;font-size:.85rem} .chapter b{font-size:clamp(1.3rem,4.6vw,2.4rem);letter-spacing:.08em;font-weight:800}
  @keyframes chap{0%{opacity:0;transform:translateY(10px)}18%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}
  /* ── 글 카드 ── */
  .book{position:relative;z-index:5;margin:-30px 14px 0;padding:26px 22px 22px;border:1px solid var(--line);border-radius:28px;
        background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(8,6,40,.5)}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;color:#1a1340;background:var(--acc);border-radius:999px;padding:1px 12px;margin-bottom:8px}
  .tag[hidden]{display:none} .tag.mine{background:var(--mint)} .tag.ai{background:#d8c9ff}
  h1{font-size:1.75rem;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.3}
  h1::after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--acc);margin:12px 0 16px}
  #text p{margin:0 0 .4em;font-size:1.04rem;color:#e8e5ff;word-break:keep-all;white-space:pre-line}
  .hint{font-size:.78rem;color:var(--mute);margin-top:-2px}
  #choices{display:flex;flex-direction:column;gap:12px;margin-top:18px;opacity:0;transform:translateY(8px);transition:.7s}
  #choices.show{opacity:1;transform:none}
  #choices button{font:inherit;font-size:1.02rem;font-weight:600;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;
       background:rgba(255,255,255,.07);border:1px solid rgba(169,139,255,.45);border-radius:18px;padding:15px 18px;transition:.2s}
  #choices button .lb{flex:1}
  #choices button::after{content:"→";font-size:1.25rem;opacity:.9}
  #choices button:hover,#choices button:focus-visible{background:rgba(169,139,255,.22);border-color:var(--acc);transform:translateY(-1px);outline:none}
  #choices button.cta,#choices[data-n="1"] button{justify-content:center;font-size:1.1rem;font-weight:700;padding:17px 22px;border:0;border-radius:999px;
       background:linear-gradient(90deg,#b8a0ff,#8d6df0);box-shadow:0 10px 28px rgba(125,91,216,.5)}
  #choices button.cta .lb,#choices[data-n="1"] button .lb{text-align:center;margin-left:1.3em}
  #choices.endrow{flex-direction:row;flex-wrap:wrap}   /* 결말: 두 버튼을 나란히 (좁은 화면에서는 아래로) */
  #choices.endrow button{flex:1 1 240px}
  /* 결말의 두 버튼(처음부터 / 미니게임)은 같은 보라색 */
  #choices button .tg{font-size:.72rem;font-weight:600;color:#d9ccff;background:rgba(169,139,255,.2);border-radius:999px;padding:1px 9px;white-space:nowrap}
  .ai{margin-top:14px;display:none} .ai.show{display:block}
  .ai .row{display:flex;gap:10px;flex-wrap:wrap}
  .ai input{flex:1;min-width:160px;font:inherit;font-size:1.05rem;color:#fff;background:rgba(10,8,40,.45);border:1px solid rgba(169,139,255,.45);border-radius:18px;padding:14px 18px}
  .ai input::placeholder{color:#8f8bbd} .ai input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(169,139,255,.25)}
  .ai button.go{font:inherit;font-size:1.02rem;font-weight:700;color:#fff;cursor:pointer;border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(90deg,#b8a0ff,#8d6df0);box-shadow:0 8px 22px rgba(125,91,216,.45)}
  .ai button.go:disabled{opacity:.6;cursor:wait}
  .ai .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
  .ai .chips button{font:inherit;font-size:.86rem;color:#d9ccff;background:rgba(169,139,255,.12);border:1px solid rgba(169,139,255,.4);border-radius:999px;padding:3px 14px;cursor:pointer}
  .ai .chips button:hover{background:rgba(169,139,255,.3)}
  .spin{display:none;color:#d9ccff;margin-top:12px} .spin.show{display:block}
  .recap{margin-top:16px;font-size:.9rem;color:#c9c5ee;border-top:1px solid var(--line);padding-top:14px}
  .recap li{margin-left:1.2em} .recap blockquote{border-left:3px solid var(--acc);padding-left:12px;margin:8px 0;color:#e0dcff}
  .recap .found2{margin-top:10px;color:#d9ccff;font-size:.92rem;font-weight:600} .recap .found2.dim{font-weight:500;color:#c4bfe8}
  .recap .epi{margin-bottom:4px;font-size:1rem;color:#efeaff}
  .recap details.route{margin-top:12px} .recap details.route summary{cursor:pointer;font-weight:700;color:#e4dcff;padding:6px 0} .recap details.route[open] summary{margin-bottom:6px}
  .credits{margin-top:26px;padding:22px 8px 6px;border-top:1px solid var(--line);text-align:center;color:#d6d2f3}
  .credits h4{font-size:.8rem;letter-spacing:.3em;color:#f0d696;font-weight:700;margin-bottom:12px}
  .credits p{font-size:.98rem;line-height:1.75;margin:6px auto;max-width:34em}
  .credits p.cr2{font-size:.9rem;color:#b9b4df;margin:2px auto}
  .credits p.thx{margin-top:16px;font-weight:700;color:#fff6e0}
  .foot{display:flex;gap:8px;align-items:flex-start;justify-content:center;color:var(--mute);font-size:.82rem;padding:18px 28px 0;line-height:1.55}
  .foot svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.6}
  /* ── 그림 애니메이션 ── */
  .px{transform:translate(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*.35px));transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .cam{animation:cam 28s ease-in-out infinite alternate;transform-box:view-box;transform-origin:480px 340px} @keyframes cam{from{transform:scale(1.03)}to{transform:scale(1.085) translate(-6px,-3px)}}
  .cloud{animation:cl linear infinite alternate} @keyframes cl{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
  .tw{animation:tw 2.2s ease-in-out infinite alternate} @keyframes tw{from{opacity:.15}to{opacity:1}}
  .wave1{animation:wv 9s linear infinite} .wave2{animation:wv 14s linear infinite reverse} @keyframes wv{to{transform:translateX(-240px)}}
  .spk{animation:spk 2.8s ease-in-out infinite alternate} @keyframes spk{from{opacity:.1}to{opacity:.85}}
  .breathe{animation:br 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%} @keyframes br{50%{transform:scale(1.012,1.018)}}
  .hair{animation:hr 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0} @keyframes hr{to{transform:skewX(-3deg) rotate(1.2deg)}}
  .scarf{animation:sc 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%} @keyframes sc{to{transform:skewY(6deg) scaleX(1.06)}}
  .sway{animation:sw 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0} @keyframes sw{to{transform:rotate(6deg)}}
  .grass{animation:gs 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%} @keyframes gs{to{transform:rotate(4deg)}}
  .glow{animation:gl 2.6s ease-in-out infinite alternate} @keyframes gl{from{opacity:.5}to{opacity:1}}
  .blink{animation:bk 6s infinite;transform-box:fill-box;transform-origin:center} @keyframes bk{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .ray{animation:ry 7s ease-in-out infinite alternate;mix-blend-mode:screen} @keyframes ry{from{opacity:.55}to{opacity:1}}
  .ff,.pt,.sp,.bb,.du{transform-box:fill-box;transform-origin:center}
  .ff{animation:ff 7s ease-in-out infinite} @keyframes ff{0%{transform:translate(0,0);opacity:0}20%{opacity:1}50%{transform:translate(var(--dx),var(--dy))}80%{opacity:1}100%{transform:translate(0,0);opacity:0}}
  .pt{animation:pt 9s linear infinite} @keyframes pt{from{transform:translate(0,-30px) rotate(0)}to{transform:translate(var(--dx),590px) rotate(420deg)}}
  .sp{animation:sp 4s ease-out infinite} @keyframes sp{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),-260px);opacity:0}}
  .bb{animation:bb 8s ease-in infinite} @keyframes bb{from{transform:translate(0,0);opacity:.8}to{transform:translate(var(--dx),-420px);opacity:0}}
  .du{animation:du 12s ease-in-out infinite} @keyframes du{0%,100%{transform:translate(0,0);opacity:0}30%,70%{opacity:.9}50%{transform:translate(var(--dx),var(--dy))}}
  .shoot{animation:sh 9s ease-in infinite;opacity:0} @keyframes sh{0%{transform:translate(0,0);opacity:0}4%{opacity:1}12%{transform:translate(-340px,190px);opacity:0}100%{opacity:0}}
  .bird{animation:bd linear infinite} @keyframes bd{from{transform:translateX(-80px)}to{transform:translateX(1060px)}}
  .flap{animation:fl .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center} @keyframes fl{to{transform:scaleY(.35)}}
  .flame{animation:fm .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%} @keyframes fm{to{transform:scale(.88,1.12) skewX(4deg)}}
  .steam{animation:up 3.6s ease-in infinite;transform-box:fill-box;transform-origin:center} @keyframes up{from{opacity:.55;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-90px) scale(1.8)}}
  .drop{animation:dr 2.8s ease-in infinite} @keyframes dr{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(38px)}}
  .dash{stroke-dasharray:16 12;animation:ds 1.6s linear infinite} @keyframes ds{to{stroke-dashoffset:-28}}
  .ripple{animation:rp 3s ease-out infinite;transform-box:fill-box;transform-origin:center} @keyframes rp{from{transform:scale(.3);opacity:.9}to{transform:scale(1.8);opacity:0}}
  .lab{animation:lb 5s ease-in-out infinite alternate} @keyframes lb{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(max-width:560px){.book{padding:22px 18px 20px}h1{font-size:1.6rem}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .hot{position:absolute;inset:0;z-index:6;pointer-events:none}
  .hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:none;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:max-content;max-width:78vw;opacity:0;animation:hsIn .5s .1s ease forwards;-webkit-tap-highlight-color:transparent}
  .hs .ic{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,240,180,.97),rgba(169,139,255,.8));box-shadow:0 0 24px rgba(255,226,140,.85),0 0 0 3px rgba(255,255,255,.6);animation:hsPulse 1.8s ease-in-out infinite;transition:transform .15s}
  .hs .ic svg{width:32px;height:32px;stroke:#2a1a5c;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .hs .ring{position:absolute;left:50%;top:31px;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:2px solid rgba(255,240,180,.95);animation:hsRing 1.8s ease-out infinite;pointer-events:none}
  .hs.body{width:auto}
  .hs.body.up .lbl{top:auto;bottom:calc(50% + 16px)}
  .hs.body .lbl{position:absolute;top:calc(50% + 16px);left:50%;white-space:normal;width:max-content;max-width:min(46vw,190px);text-align:center;transform:translateX(calc(-50% + var(--shift,0px)))}
  .hs.body .ic{width:50px;height:50px}.hs.body .ic svg{width:26px;height:26px}.hs.body .ring{width:50px;height:50px;margin:-25px 0 0 -25px;top:25px}
  .hs .lbl{font-size:.74rem;line-height:1.3;text-align:center;background:rgba(10,8,40,.72);padding:3px 10px;border-radius:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
  .hs:hover .ic,.hs:focus-visible .ic{transform:scale(1.12)}.hs:active .ic{transform:scale(.92)}.hs:focus-visible{outline:none}.hs:focus-visible .ic{box-shadow:0 0 0 4px #fff}
  @keyframes hsIn{to{opacity:1}}@keyframes hsPulse{50%{transform:scale(1.08)}}@keyframes hsRing{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}

  /* ── 그림에 녹아든 선택 영역: 독립된 버튼 대신, 그림 속 그 부분이 은은히 숨 쉬듯 빛나고 직접 누르면 선택됩니다 ── */
  .hs .ic{width:96px;height:96px;background:radial-gradient(circle,rgba(255,246,205,.62) 0%,rgba(255,226,150,.30) 38%,rgba(255,226,150,0) 70%);box-shadow:none;mix-blend-mode:screen;animation:zoneBreath 2.8s ease-in-out infinite;border-radius:50%}
  .hs .ic svg{display:none}
  .hs .ic::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,240,180,.95);animation:zoneSpark 1.6s ease-in-out infinite}
  .hs .ring{display:none}
  .hs.body .ic{width:96px;height:96px}
  .hs .lbl{background:rgba(10,8,40,.5);font-size:clamp(.98rem,3.9vw,1.15rem);font-weight:600;line-height:1.35;padding:4px 12px;max-width:min(72vw,320px);opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.7);transition:opacity .2s,background .2s}
  .hs:hover .ic,.hs:focus-visible .ic{transform:scale(1.2);animation-play-state:paused;background:radial-gradient(circle,rgba(255,250,220,.85) 0%,rgba(255,226,150,.45) 40%,rgba(255,226,150,0) 72%)}
  .hs:hover .lbl,.hs:focus-visible .lbl{opacity:1;background:rgba(10,8,40,.78)}
  .hs:focus-visible .ic{box-shadow:none;outline:2px solid #fff;outline-offset:-10px}
  @keyframes zoneBreath{0%,100%{transform:scale(.86);opacity:.7}50%{transform:scale(1.08);opacity:1}}

  /* 직접 입력한 단어: 고정 그림 위에 단어를 크게 빛나는 말풍선으로 띄운다 */

function stones(n){let s="";for(let i=0;i<n;i++){const x=70+i*(820/(n-1||1)),y=HZ-6+((i*37)%30),rx=14+(i%4)*3,ry=20+(i%3)*6;
  s+=`<g><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#6c7080"/><ellipse cx="${x-rx*.3}" cy="${y-ry*.35}" rx="${rx*.4}" ry="${ry*.3}" fill="#d0d4e4" opacity=".4"/><circle class="drop" style="animation-delay:${-(i%7)*.45}s" cx="${x+rx*.4}" cy="${y-ry*.25}" r="2.6" fill="#bfe3ff"/></g>`}return s}
function silk(n){const col=["#e8a0a8","#f4d58a","#9fd8c0","#a7b8f0","#f2b27a","#d6a6e6"];let s="";

function mainland(m){return `<path d="M700 ${HZ+8} Q770 ${HZ-40} 840 ${HZ-18} T990 ${HZ-34} V${HZ+8}Z" fill="${m.far}" opacity=".95"/><circle class="glow" cx="800" cy="${HZ-6}" r="2.4" fill="#ffe29a"/><circle class="glow" cx="860" cy="${HZ-12}" r="2.4" fill="#ffe29a"/><circle class="glow" cx="925" cy="${HZ-16}" r="2.4" fill="#ffe29a"/>`}
function bridge(){const d=`M690 ${HZ+4} C790 ${HZ-160} 890 ${HZ-160} 980 ${HZ-30}`;

   [.15,.3,.45,.6,.75,.9].map((t,i)=>{const x=690+290*t,y=(1-t)*(1-t)*(1-t)*(HZ+4)+3*(1-t)*(1-t)*t*(HZ-160)+3*(1-t)*t*t*(HZ-160)+t*t*t*(HZ-30);return `<circle class="glow" style="animation-delay:${-i*.4}s" cx="${x}" cy="${y-8}" r="5" fill="#ffe9a8"/>`}).join("")}
function boats(n){let s="";const col=["#e8a0a8","#f4d58a","#9fd8c0","#a7b8f0","#f2b27a"];
  for(let i=0;i<n;i++){const x=120+i*150+(i%2)*20,y=HZ+40+(i%3)*26,c=col[i%5];
    s+=`<g class="sway" style="animation-delay:-${i*.6}s;animation-duration:${4+i%3}s"><path d="M${x-22} ${y} L${x+22} ${y} L${x+14} ${y+10} L${x-14} ${y+10}Z" fill="#6a4a2c"/><path d="M${x} ${y-4} L${x} ${y-44} L${x+24} ${y-8}Z" fill="${c}"/><path d="M${x} ${y-4} L${x} ${y-36} L${x-16} ${y-8}Z" fill="${c}" opacity=".8"/></g>`}
  return s}
function lights(n){let s="";for(let i=0;i<n;i++){const x=70+rnd(i,2)*820,y=HZ+60+rnd(i,3)*110;
  s+=`<circle class="glow" style="animation-delay:${-rnd(i,4)*2}s" cx="${x}" cy="${y}" r="6" fill="#ffd27a"/><circle cx="${x}" cy="${y}" r="20" fill="#ffd27a" opacity=".2" filter="url(#soft)"/>`}return s}
function foreground(kind){let s="";
  if(kind==="rocks") s=`<path d="M-20 540 L-20 480 Q40 440 110 470 Q150 450 200 500 L220 540Z" fill="#05070f"/><path d="M760 540 Q800 480 860 490 Q920 470 980 520 L980 540Z" fill="#05070f"/>`;
  else{ for(let side=0;side<2;side++)for(let i=0;i<17;i++){const x=side?740+i*14:-10+i*13,h=50+rnd(i,side+9)*85,dx=(rnd(i,side+3)-.5)*34;
    s+=`<path class="grass" style="animation-delay:-${rnd(i,6)*3}s;animation-duration:${3+rnd(i,2)*2}s" d="M${x} 546 Q${x+dx*.4} ${546-h*.6} ${x+dx} ${546-h}" stroke="#05070f" stroke-width="${4+rnd(i,4)*3}" fill="none" stroke-linecap="round"/>`;
    if(kind==="flowers"&&i%2===0) s+=`<circle class="glow" cx="${x+dx}" cy="${546-h}" r="4.5" fill="${side?'#ff9aae':'#ffd23a'}"/>`}}
  return s}
function particles(type,n){let s="";
  for(let i=0;i<n;i++){const x=rnd(i,1)*960,y=rnd(i,2)*540,dx=(rnd(i,3)-.5)*90,dy=(rnd(i,4)-.5)*70,dl=-rnd(i,5)*8;
    if(type==="firefly") s+=`<circle class="ff" style="animation-delay:${dl}s;animation-duration:${5+rnd(i,6)*5}s;--dx:${dx}px;--dy:${dy}px" cx="${x}" cy="${240+rnd(i,2)*280}" r="7" fill="url(#ffG)"/>`;
    else if(type==="petal") s+=`<ellipse class="pt" style="animation-delay:${dl*1.4}s;animation-duration:${8+rnd(i,6)*6}s;--dx:${dx*1.6}px" cx="${x}" cy="0" rx="4.4" ry="2.2" fill="${i%3?'#ffd23a':'#ff9aae'}"/>`;
    else if(type==="spark") s+=`<circle class="sp" style="animation-delay:${dl*.5}s;animation-duration:${3+rnd(i,6)*3}s;--dx:${dx}px" cx="${300+rnd(i,2)*360}" cy="${HZ+70+rnd(i,7)*110}" r="${1.4+rnd(i,8)*2}" fill="#ffb050"/>`;
    else if(type==="bubble") s+=`<circle class="bb" style="animation-delay:${dl}s;animation-duration:${6+rnd(i,6)*6}s;--dx:${dx*.5}px" cx="${x}" cy="${380+rnd(i,2)*170}" r="${3+rnd(i,8)*8}" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".55"/>`;
    else if(type==="dust") s+=`<circle class="du" style="animation-delay:${dl}s;animation-duration:${9+rnd(i,6)*6}s;--dx:${dx}px;--dy:${dy}px" cx="${x}" cy="${y}" r="${1+rnd(i,8)*2}" fill="#fff2c0"/>`;
    else if(type==="bird"&&i<5) s+=`<g class="bird" style="animation-duration:${26+i*6}s;animation-delay:-${i*7}s"><g transform="translate(0 ${70+i*34+rnd(i,2)*20})"><path class="flap" d="M-10 0 Q-5 -7 0 0 Q5 -7 10 0" stroke="#1a1a30" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/></g></g>`;
    else if(type==="star"&&i<3) s+=`<g class="shoot" style="animation-delay:-${i*3.1}s;animation-duration:${8+i*3}s"><path d="M${620+i*120} ${30+i*40} l50 -28" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".9"/></g>`;
  }
  return s}

function fxOnly(a){ // 그림(사진)이 있는 장면: 배경은 그림, 위에는 반딧불·꽃잎 같은 움직이는 입자만 얹는다

function art(a){

   <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m.sky[0]}"/><stop offset=".55" stop-color="${m.sky[1]}"/><stop offset="1" stop-color="${m.sky[2]}"/></linearGradient>
   <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m.sea[0]}"/><stop offset="1" stop-color="${m.sea[1]}"/></linearGradient>
   <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4dcc8"/><stop offset=".35" stop-color="#6a9a70"/><stop offset="1" stop-color="#244c3a"/></linearGradient>

   <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
   <radialGradient id="sunG"><stop offset="0" stop-color="${sun?sun.c:'#fff'}" stop-opacity=".9"/><stop offset=".4" stop-color="${sun?sun.c:'#fff'}" stop-opacity=".25"/><stop offset="1" stop-color="${sun?sun.c:'#fff'}" stop-opacity="0"/></radialGradient>
   <radialGradient id="ffG"><stop offset="0" stop-color="#fff6b0"/><stop offset=".3" stop-color="#ffe070" stop-opacity=".6"/><stop offset="1" stop-color="#ffe070" stop-opacity="0"/></radialGradient>
   ${sun?`<radialGradient id="rayG" gradientUnits="userSpaceOnUse" cx="${sun.x}" cy="${sun.y}" r="900"><stop offset="0" stop-color="${sun.c}" stop-opacity=".5"/><stop offset="1" stop-color="${sun.c}" stop-opacity="0"/></radialGradient>`:""}
   <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs><g class="cam">`;
  s+=`<rect x="-60" y="-60" width="1080" height="660" fill="url(#sky)"/>`;
  if(m.stars||a.stars) s+=stars();
  s+=P(1,sunGlow(sun));
  if(a.rays!==false&&sun&&!sun.moon&&a.mood!=="void") s+=rays(sun);
  s+=P(2,clouds(m,a.clouds??4));
  if(a.seam) s+=`<rect x="-60" y="268" width="1080" height="6" fill="#ffd98a" opacity=".4" filter="url(#soft)"/><rect x="-60" y="270" width="1080" height="1.4" fill="#ffe9b0" opacity=".7"/>`;
  if(a.far!==false) s+=P(3,ridge(1,HZ-6,64,m.far,.9)+ridge(2.7,HZ+4,40,m.mid,.8));
  if(a.mainland) s+=P(3,mainland(m));
  if(a.mount) s+=P(5,hallasan(m,a.mount));
  if(a.orum) s+=P(8,orums(m,a.orum,a.village,a.name));
  if(hasSea) s+=sea(m,sun);
  if(a.isle) s+=`<ellipse cx="${a.isle}" cy="${HZ+10}" rx="42" ry="12" fill="#2a4634"/>`;
  if(a.bridge) s+=bridge();
  if(a.boats) s+=P(9,boats(a.boats));

  if(a.silk) s+=P(11,`<g transform="translate(0 0)">${silk(a.silk)}</g>`);

  if(a.p) s+=P(14,particles(a.p[0],a.p[1]));
  return s+`</g></svg>`}

  choices:[["흙을 치마폭에 가득 담는다","c2_soil"]]},
 c2_soil:{ch:["제2장","섬을 빚다"],title:"치마폭 가득 흙을 담고",
  text:["할망은 치마폭을 펼쳐 바다 밑의 흙을 가득 담았습니다. 치마가 불룩해지고, 걸음마다 흙이 출렁였지요.","바다 한가운데에 이르자 할망은 조심조심 치마를 기울이기 시작했습니다.","“어떤 모양으로 만들어 볼까?”"],
  art:{mood:"day",alt:"흙을 안고 선 할망",fig:"stand",x:300,s:1,soil:true,p:["dust",16],fg:"rocks"},
  choices:[["하늘에 닿을 만큼 높이 쌓는다","c2_tall","brave"],["넓고 포근하게 둥글게 쌓는다","c2_soft","warm"]]},
 c2_tall:{title:"하늘 가까이 솟은 산",
  text:["흙무더기가 쑥쑥 올라갔습니다. 구름을 뚫고 하늘 가까이까지 솟은 그 산이 바로 한라산입니다.","꼭대기에는 움푹 파인 곳이 생겼는데, 훗날 맑은 물이 고여 백록담이라 불리게 됩니다.","할망은 이마에 손을 대고 올려다보며 뿌듯하게 웃었습니다."],
  art:{mood:"golden",alt:"하늘 가까이 솟은 한라산",mount:1,fig:"stand",x:130,s:.7,clouds:6},
  choices:[["치마를 탈탈 털어 남은 흙을 뿌린다","c2_orum"],["미니게임\n그림 맞추기","mg:puzzle","curious"]]},
 c2_soft:{title:"어머니의 품 같은 산",
  text:["할망은 손바닥으로 흙을 토닥토닥 다독였습니다. 가파르지 않고 넉넉하게 펼쳐진 한라산이 만들어졌습니다.","그 품이 얼마나 넓은지, 훗날 사람들은 한라산을 ‘어머니의 산’이라고 부르게 됩니다.","할망은 완성된 산을 쓰다듬으며 나직이 흥얼거렸습니다."],
  art:{mood:"golden",alt:"넉넉한 한라산",mount:.82,fig:"stand",x:130,s:.7,p:["petal",14],clouds:5},
  choices:[["치마를 탈탈 털어 남은 흙을 뿌린다","c2_orum"]]},
 c2_orum:{title:"삼백육십여 개의 오름",
  text:["할망이 치마를 탈탈 털자 남은 흙이 섬 곳곳에 흩어졌습니다. 그런데 오래 입은 할망의 치마는 군데군데 구멍이 나 있었습니다. 걸어 다니는 동안 구멍으로 흙이 졸졸 흘러내렸지요.","흘러내린 흙은 섬 구석구석에 작고 동글한 봉우리가 되었습니다. 그 수가 무려 삼백육십여 개, 바로 제주의 오름입니다.","할망은 오름 하나하나를 살펴보며 흐뭇하게 웃었습니다."],
  art:{mood:"golden",alt:"오름이 가득한 섬",mount:1,orum:10,fig:"stand",x:110,s:.72,p:["dust",22],fg:"flowers"},
  choices:[["오름마다 이름을 불러 준다","c2_name","curious"],["오름 위에 꽃씨를 뿌려 준다","c2_seed","warm"]]},
 c2_name:{title:"이름을 얻은 오름",
  text:["“너는 다랑쉬, 너는 용눈이, 너는 새별!” 할망이 이름을 불러 줄 때마다 오름이 으쓱으쓱 솟아오르는 듯했습니다.","이름을 얻은 오름들은 저마다 다른 모양과 표정으로 섬을 가득 채웠습니다. 이름이 있으니 이제 누구든 찾아올 수 있겠지요.","섬은 더 이상 이름 없는 땅이 아니었습니다."],
  art:{mood:"golden",alt:"이름이 붙은 오름들",mount:1,orum:10,name:true,fig:"stand",x:110,s:.72,p:["firefly",14],fg:"flowers"},
  choices:[["한라산 품에 안겨 쉬어 본다","c2_rest"]]},
 c2_seed:{title:"꽃이 핀 섬",
  text:["할망이 손끝으로 꽃씨를 뿌리자 노란 유채꽃이 파도처럼 번지고, 붉은 동백이 불꽃처럼 피어났습니다.","오름마다 다른 꽃이 피어, 섬은 한 폭의 수놓은 보자기처럼 아름다워졌습니다.","바람이 꽃잎을 싣고 바다 위로 사뿐사뿐 날아갔습니다."],
  art:{mood:"golden",alt:"꽃이 가득 핀 오름",mount:1,orum:10,fig:"stand",x:110,s:.72,p:["petal",26],fg:"flowers"},
  choices:[["한라산 품에 안겨 쉬어 본다","c2_rest"]]},
 c2_rest:{title:"산을 베고 눕다",
  text:["일을 마친 할망은 한라산 봉우리를 베개 삼아 길게 누웠습니다. 두 발은 바다 건너 관탈섬에 걸쳤지요.","포근한 산, 따뜻한 바람, 하나둘 돋아나는 별. 할망은 오랜만에 깊게 숨을 내쉬었습니다.","“이만하면 정말 좋은 섬이구나.”"],
  art:{mood:"dusk",alt:"한라산을 베고 누운 할망",mount:1,orum:8,fig:"lie",isle:880,p:["firefly",12],stars:true,fg:"grass"},
  choices:[["발을 담그고 첨벙첨벙 물장구를 친다","c2_splash","brave"],["누운 채 별을 하나하나 세어 본다","c2_sky","curious"]]},
 c2_splash:{title:"첨벙첨벙 물장구",
  text:["첨벙! 할망의 발짓에 바다가 출렁이고, 튀어 오른 물방울이 별처럼 섬 곳곳에 흩어졌습니다.","물방울이 떨어진 자리마다 맑은 샘물이 퐁퐁 솟아올랐습니다. 훗날 사람들이 마실 소중한 물이었지요.","할망은 깔깔 웃으며 한 번 더 발을 굴렀습니다."],
  art:{mood:"dusk",alt:"물장구로 튀는 물방울",mount:1,orum:8,fig:"lie",splash:true,isle:880,p:["bubble",16],fg:"grass"},
  choices:[["일어나 섬을 둘러본다","c3_people"]]},
 c2_sky:{title:"별을 세는 밤",
  text:["하나, 둘, 셋… 할망이 별을 셀 때마다 별빛이 한 줄기씩 섬 위로 내려앉았습니다.","“언젠가 이 섬에 누군가 찾아오면, 이 별들을 함께 세어 주어야지.” 할망은 소원처럼 중얼거렸습니다.","그때 별똥별 하나가 긴 꼬리를 그으며 바다로 떨어졌습니다."],
  art:{mood:"night",alt:"별이 가득한 밤하늘",mount:1,orum:8,fig:"lie",isle:880,p:["star",3],fg:"grass"},
  choices:[["아침이 되어 섬을 둘러본다","c3_people"],["미니게임\n별자리 잇기","mg:const","curious"]]},
 c3_people:{ch:["제3장","섬에 온 사람들"],title:"섬에 온 사람들",
  text:["시간이 흘러 섬에 하나둘 사람들이 찾아왔습니다. 오름 아래 초가집이 들어서고, 굴뚝마다 저녁 연기가 피어올랐습니다.","사람들은 산처럼 커다란 할망을 올려다보며 처음에는 겁을 냈습니다. 하지만 할망이 환하게 웃자 어느새 곁으로 모여들었지요.","돌담을 쌓고 밭을 일구며, 섬은 점점 사람의 냄새로 따뜻해졌습니다."],
  art:{mood:"golden",alt:"마을이 생긴 섬",mount:1,orum:10,village:true,fig:"stand",x:110,s:.75,fg:"flowers"},
  choices:[["사람들의 이야기를 귀 기울여 듣는다","c3_listen","warm"],["사람들을 손바닥에 올려 섬을 구경시켜 준다","c3_palm","curious"]]},
 c3_listen:{title:"저녁 마당의 이야기",
  text:["할망은 몸을 낮추고 사람들의 이야기를 들었습니다. 바다에서 고기를 잡는 이야기, 돌담을 쌓는 이야기, 바람 센 밤에 아이를 재우는 이야기.","이야기를 들을수록 할망은 이 섬이 얼마나 소중한지 깨달았습니다.","사람들의 웃음소리가 오름 사이로 따뜻하게 퍼져 갔습니다."],
  art:{mood:"dusk",alt:"저녁 무렵의 마을",mount:1,orum:10,village:true,fig:"stand",x:110,s:.75,p:["firefly",16],fg:"grass"},
  choices:[["사람들에게 소원을 물어본다","c3_wish"]]},
 c3_palm:{title:"할망의 손바닥 위에서",
  text:["할망이 커다란 손바닥을 내밀자 사람들이 조심조심 올라탔습니다. 할망은 하늘 높이 손을 들어 올렸지요.","“저기 봐요, 파도 위에 햇살이 부서져요!” 사람들은 처음 보는 섬의 모습에 탄성을 질렀습니다.","오름과 바다가 한눈에 펼쳐진 그날을 아이들은 오래도록 잊지 못했습니다."],
  art:{mood:"day",alt:"하늘 높이 올린 손바닥",mount:1,orum:10,village:true,fig:"stand",x:140,s:1,arms:"reach",fg:"none"},
  choices:[["사람들을 내려 주며 소원을 물어본다","c3_wish"]]},
 c3_wish:{title:"육지로 가는 다리",
  text:["할망이 소원을 묻자, 사람들이 모여 입을 모았습니다. “할망, 우리는 육지가 그리워요. 바다를 건너갈 다리를 놓아 주실 수 있을까요?”","할망은 잠시 생각하다 말했습니다. “좋다. 내 낡은 속옷을 명주 백 통으로 새로 지어 준다면, 육지까지 튼튼한 다리를 놓아 주마.”"] ,
  art:{mood:"dusk",alt:"육지가 멀리 보이는 저녁 바다",mount:1,orum:10,village:true,mainland:true,fig:"stand",x:140,s:.8,p:["firefly",12],fg:"grass"},
  choices:[["사람들을 도와 명주를 모으러 나선다","c3_silk","warm"],["할망 곁에 남아 이야기를 듣는다","c4_sons","curious"]]},
 c3_silk:{title:"한 통씩, 한 통씩",
  text:["마을마다 명주를 모으기 시작했습니다. 한 통, 두 통… 집집마다 아껴 둔 고운 천이 모였습니다.","하지만 날이 갈수록 모으기가 어려워졌습니다. 아흔 통, 아흔여섯 통… 드디어 아흔아홉 통이 모였습니다.","이제 단 한 통, 마지막 한 통만 남았습니다."],
  art:{mood:"dusk",alt:"하늘에서 늘어지는 명주",mount:1,orum:10,village:true,silk:6,mainland:true,p:["dust",18],fg:"grass"},
  choices:[["마을 사람들과 함께 밤새 베를 짠다","c3_weave","warm"],["아흔아홉 통이라도 일단 할망께 건넨다","c3_ninety","brave"]]},
 c3_weave:{set:"e_bridge",title:"밤새 짠 마지막 한 통",
  text:["사람들은 불을 밝히고 둘러앉아 밤새 베를 짰습니다. 아이는 실을 잡고, 어른은 북을 던지고, 노인은 노래를 불렀지요.","동이 틀 무렵, 마침내 마지막 한 통이 완성되었습니다. 백 통이 모두 채워진 것입니다.","사람들은 서로의 손을 맞잡고 환호했습니다. 이제 할망 앞에 약속의 천을 펼칠 차례였습니다."],
  art:{mood:"night",alt:"밤새 베를 짜는 마을",mount:1,orum:10,village:true,silk:6,p:["firefly",20],fg:"grass"},
  choices:[["할망 앞에 명주 백 통을 펼친다","ai"]]},
 c3_ninety:{set:"e_ninety",title:"아흔아홉 통의 약속",
  text:["아흔아홉 통의 명주가 할망 앞에 쌓였습니다. 할망은 부지런히 속옷을 짓기 시작했지만, 한 통이 모자라 끝내 완성하지 못했습니다.","할망은 아쉬운 듯 웃었습니다. 그래도 사람들의 정성은 충분히 전해졌지요.","약속은 약속이었기에, 할망은 조용히 먼 바다를 바라보았습니다."],
  art:{mood:"dusk",alt:"쌓인 명주를 바라보는 할망",mount:1,orum:10,village:true,silk:4,mainland:true,fig:"stand",x:130,s:.85,p:["dust",14],fg:"grass"},
  choices:[["할망 곁에 가만히 앉는다","ai"]]},
 c4_sons:{ch:["제3장","오백 아들의 이야기"],title:"흉년이 든 해",
  text:["할망에게는 오백 명의 아들이 있었습니다. 장난꾸러기에 먹보들이었지만, 할망에게는 세상에서 가장 귀한 보물이었지요.","그런데 어느 해 심한 흉년이 들었습니다. 들에는 곡식이 마르고 아들들은 배고프다며 울상이었습니다.","할망은 산자락에 큰 가마솥을 걸고 죽을 끓이기로 했습니다."],
  art:{mood:"ember",alt:"큰 가마솥이 걸린 산자락",mount:1,orum:6,pot:true,p:["spark",16],fg:"grass"},
  choices:[["솥을 직접 저으러 가까이 다가간다","c4_pot","brave"],["아들들을 불러 함께 죽을 끓인다","c4_together","warm"]]},
 c4_pot:{set:"e_stones",title:"김이 오르는 가마솥",
  text:["할망은 팔을 걷어붙이고 솥을 저었습니다. 김이 모락모락 오르고 구수한 냄새가 산을 넘었지요.","너무 열심히 젓던 할망은 그만 발이 미끄러져 커다란 솥 속으로 빠지고 말았습니다.","솥 안에서는 죽이 보글보글 끓고 있었고, 산에서는 아들들이 돌아오는 소리가 들려왔습니다."],
  art:{mood:"ember",alt:"끓어오르는 가마솥",mount:1,orum:6,pot:true,p:["spark",24],fg:"rocks"},
  choices:[["이야기를 조용히 지켜본다","ai"]]},
 c4_together:{set:"e_porridge",title:"모두 함께 끓인 죽",
  text:["할망이 큰 소리로 아들들을 불렀습니다. 오백 명의 아들이 우르르 몰려와 한 명은 불을 지피고, 한 명은 물을 길어 오고, 또 한 명은 솥을 저었지요.","많은 손이 모이니 죽은 금세 끓어올랐고, 아무도 다치지 않았습니다.","구수한 냄새가 마을까지 퍼져, 이웃들도 그릇을 들고 모여들었습니다."],
  art:{mood:"ember",alt:"함께 죽을 끓이는 사람들",mount:1,orum:6,pot:true,potSafe:true,lights:16,p:["firefly",16],fg:"grass"},
  choices:[["따뜻한 죽 한 그릇을 받아 든다","ai"]]},
 ai:{ch:["마지막 장","당신이 지은 한 장면"],ai:true,title:"할망의 마지막 부탁",picBy:{e_stones:"ai_pot"},   /* 솥에 빠진 길로 왔을 때는 솥과 김 속 할망 그림(images/ai_pot.jpg) */
  
  textBy:{e_stones:["솥 안에서 할망의 목소리가 희미하게 들려왔습니다.","“얘들아… 이 섬에 마지막으로 하나만 더 남기고 싶구나. 네가 말해 주렴. 무엇이 있었으면 좋겠니?”","당신이 단어 하나를 말하면, 이야기의 한 장면이 새로 그려집니다."]},
  text:["할망이 하늘을 올려다보며 말했습니다.","“이 섬에 마지막으로 하나만 더 놓고 싶구나. 네가 말해 주렴. 무엇이 있었으면 좋겠니?”","당신이 단어 하나를 말하면, 이야기의 한 장면이 새로 그려집니다."],
  art:{mood:"night",alt:"별빛 아래 선 할망",mount:1,orum:10,village:true,fig:"stand",x:140,s:.85,p:["star",3],fg:"grass"}},
 e_bridge:{end:true,mine:true,title:"이어진 길",
  text:["할망은 새 속옷을 입고 활짝 웃었습니다. 그리고 약속대로 바다 위에 한 걸음, 두 걸음 돌을 놓아 길을 이어 가기 시작했습니다.","제주와 육지가 처음으로 맞닿던 날, 사람들은 서로 부둥켜안고 춤을 추었습니다. 섬은 더 이상 외롭지 않았습니다.","전해 오는 이야기에서는 단 한 통이 모자라 다리가 놓이지 못하지만, 당신이 함께한 이야기에서는 사람들이 힘을 모아 그 한 통을 채웠습니다."],
  art:{mood:"golden",alt:"바다 위에 놓인 빛의 다리",mount:1,orum:10,village:true,bridge:true,p:["petal",24],fg:"flowers"}},
 e_ninety:{end:true,mine:false,title:"모자란 한 통",
  text:["한 통이 모자라 속옷은 끝내 완성되지 못했고, 할망은 다리를 놓다 멈추었습니다. 그래서 제주는 바다에 둘러싸인 섬으로 남았다고 전해집니다.","어쩌면 그 모자란 한 통 덕분에 제주만의 바람과 돌과 이야기가 오래오래 지켜졌는지도 모릅니다.","모자라서 더 아름다운 이야기도 있으니까요."],
  art:{mood:"dusk",alt:"끝내 놓이지 못한 다리",mount:1,orum:10,village:true,silk:4,mainland:true,p:["firefly",18],fg:"grass"}},
 e_stones:{end:true,mine:false,title:"오백장군",
  text:["죽솥에 빠진 어머니를 모른 채 돌아온 아들들은 죽을 맛있게 먹었습니다. 그러다 맨 마지막 막내가 솥 바닥에서 어머니의 흔적을 발견했지요.","아들들은 깊은 슬픔에 빠져 한라산 영실 계곡에서 그대로 굳어 돌이 되었다고 합니다. 지금도 오백장군 바위가 오름 곁을 지키고 있어요.","할망의 사랑은 그렇게 바위가 되어 오늘도 섬을 지켜 주고 있답니다."],
  art:{mood:"storm",alt:"눈물 흘리는 오백 개의 바위",mount:1,orum:4,stones:16,p:["firefly",12],fg:"rocks"}},
 e_porridge:{end:true,mine:true,title:"함께 끓인 죽",
  text:["오백 개의 그릇에 따뜻한 죽이 담기고, 산자락마다 환한 불빛이 켜졌습니다. 아들들과 이웃들은 배불리 먹고, 할망 곁에 둘러앉아 도란도란 이야기를 나누었지요.","함께하면 흉년의 밤도 따뜻해진다는 것을, 그날 섬은 알게 되었습니다.","이 이야기는 당신이 함께 써 내려간 결말입니다."],
  art:{mood:"ember",alt:"따뜻한 불빛이 가득한 산자락",mount:1,orum:6,pot:true,potSafe:true,lights:22,p:["spark",22],fg:"grass"}},
 e_star:{end:true,mine:true,hidden:true,title:"별로 이어진 길",
  text:["마지막 한 통은 밤하늘의 별빛으로 짜였습니다. 호기심 많은 아이가 “이 실은 어디서 왔을까?” 하고 올려다보다가, 별빛 한 가닥을 따라 베틀에 걸었거든요.","할망이 새 속옷을 입고 웃자, 다리는 바다 위가 아니라 별이 흐르는 하늘로 놓였습니다. 육지에도, 아직 가 보지 못한 먼 섬에도 닿는 길이었지요.","궁금해하는 마음이 길을 만든다는 것을, 그날 제주는 알게 되었습니다. 이것은 당신이 호기심으로 열어 낸 숨은 결말입니다."],
  art:{mood:"night",alt:"별빛으로 이어진 하늘의 다리",mount:1,orum:10,village:true,bridge:true,p:["star",3],fg:"flowers"}},
 e_boat:{end:true,mine:true,hidden:true,title:"스스로 건넌 바다",
  text:["아흔아홉 통의 명주로는 속옷을 끝내 지을 수 없었고, 다리는 놓이지 못했습니다. 사람들은 한동안 고개를 숙였지요.","그때 한 사람이 앞으로 나섰습니다. “다리가 없다면 우리가 배를 지으면 되지요!” 명주는 돛이 되고, 오름의 나무는 배가 되었습니다.","용기를 낸 사람들은 파도를 헤치고 스스로 육지에 닿았습니다. 할망은 손을 흔들며 바람을 불어 돛을 밀어 주었지요. 이것은 당신이 용기로 열어 낸 숨은 결말입니다."],
  art:{mood:"dawn",alt:"명주 돛을 단 배들이 바다를 건넌다",mount:1,orum:10,village:true,boats:5,mainland:true,fg:"rocks"}},
 e_mountain:{end:true,mine:true,hidden:true,title:"산이 된 할망",
  text:["죽솥에 빠진 할망은 끝내 돌아오지 못했습니다. 돌아온 아들들은 솥 앞에서 오래오래 울었습니다.","그 눈물이 땅을 적시자 할망의 따뜻한 마음이 흙 속으로 스며들었습니다. 한라산이 한 번 크게 숨을 쉬었고, 오름마다 푸른 풀이 돋아났지요.","아들들은 돌이 되는 대신 산을 지키는 바람이 되었습니다. 지금도 한라산이 어머니의 품처럼 포근한 것은 그 때문이라고 합니다. 이것은 당신이 따뜻한 마음으로 열어 낸 숨은 결말입니다."],
  art:{mood:"golden",alt:"포근한 산이 된 할망",mount:.9,orum:10,village:true,p:["petal",22],fg:"flowers"}},
 e_flavors:{end:true,mine:true,hidden:true,title:"오백 가지 맛의 죽",
  text:["오백 명의 아들과 이웃들은 저마다 호기심이 많았습니다. “이걸 넣으면 어떤 맛일까?” 한 명은 유채꽃을, 한 명은 동백잎을, 또 한 명은 바다에서 건진 미역을, 또 다른 한 명은 새콤달콤한 귤을 솥에 넣었지요.","죽은 한 숟갈마다 맛이 달랐습니다. 달콤하고, 구수하고, 짭짤하고, 향긋했어요. 흉년의 밤이 갑자기 잔칫날처럼 떠들썩해졌습니다.","새로운 것을 궁금해하는 마음이 가장 따뜻한 밥상을 만들었습니다. 이것은 당신이 호기심으로 열어 낸 숨은 결말입니다."],

た。"], "tangerine": ["みかんがやって来た日", "ハルマンがふうっと息を吹くと、海の上に黄色いみかんがふわりと浮かびました。", "みかんは波にのってやって来て、島じゅうの畑にたわわに実りました。", "その日から、済州の人々はみかんを見るたびに、ソルムンデハルマンの贈りものを思い出しました。"], "shootingstar": ["ハルマンの贈りもの、流れ星", "ハルマンがスカートをゆらすと、ポケットから流れ星がころころと転がり出ました。", "流れ星は夜空に長い尾を引いて、オルムとオルムのあいだに降りてきました。", "人々は流れ星を見上げて願いごとをし、「この島には、こんなすてきなこともあるんだね」と笑いました。"], "hareubang": ["ドルハルバンが宿った島", "ハルマンが指先で宙をそっとなでると、どこからか石のおじいさん、ドルハルバンがすっくと姿をあらわしました。", "ドルハルバンは村の入り口に立って、風や波から島を守ってくれました。", "その日から、済州の人々はドルハルバンを見るたびに、ソルムンデハルマンの贈りものを思い出しました。"], "haenyeo": ["ハルマンの贈りもの、海女", "ハルマンがふうっと息を吹くと、海の上に、息つぎの口笛といっしょに海女が浮かび上がりました。", "海女は深い海から、アワビやサザエをたっぷりととり上げました。", "人々は海女の息つぎの音を聞きながら、「この島には、こんなたくましい人もいるんだね」と笑いました。"], "wind": ["ハルマンの贈りもの、風", "ハルマンが指先で宙をそっとなでると、どこからか涼しい風がふいてきました。", "風はオルムのススキをゆらし、海の上の帆かけ船を押してくれました。", "子どもたちは風といっしょに走りまわり、この島をいつまでも覚えていようと決めました。"], "hallasan": ["ハルラ山にさす朝日", "ハルマンがスカートの土をそっと集めて積み上げると、島のまんなかにハルラ山がそびえ立ちました。", "ハルラ山は雲の上に頭を出して、朝日をいちばんに迎えました。", "子どもたちはハルラ山を見上げて、この島をいつまでも覚えていようと決めました。"], "baengnokdam": ["ペンノクダムのある山", "ハルマンが指先でハルラ山のてっぺんをそっとなでると、澄んだ水をたたえたペンノクダムが姿をあらわしました。", "ペンノクダムには空と雲がうつり、白い鹿がやって来て水を飲みました。", "子どもたちはペンノクダムのそばにすわって鹿をながめ、この島をいつまでも覚えていようと決めました。"]}, "zh": {"rainbow": ["奶奶的礼物：彩虹", "奶奶抖了抖裙子，彩虹从口袋里骨碌碌地滚了出来。", "彩虹从汉拿山的山顶，一直架起一座七彩的桥，通到大海的尽头。", "孩子们在彩虹下奔跑，决定要永远记住这座岛。"], "whale": ["鲸鱼来到的岛", "奶奶轻轻吹了一口气，一头鲸鱼悠悠地浮出了海面。", "鲸鱼随着海浪的声音喷着水，绕着岛转了一圈。", "孩子们朝鲸鱼挥着手，决定要永远记住这座岛。"], "camellia": ["奶奶的礼物：山茶花", "奶奶用指尖轻轻在空中一划，不知从哪里，红色的山茶花闪闪发光地绽放了。", "山茶花在每座岳上像火焰一样盛开，把冬天的岛染得暖烘烘的。", "孩子们把山茶花插在头发上玩耍，决定要永远记住这座岛。"], "tangerine": ["橘子到来的那一天", "奶奶轻轻吹了一口气，金黄的橘子悠悠地漂浮在海面上。", "橘子乘着海浪漂来，在岛上各处的田里结得沉甸甸的。", "从那天起，济州的人们每次看到橘子，就会想起雪门台奶奶的礼物。"], "shootingstar": ["奶奶的礼物：流星", "奶奶抖了抖裙子，流星从口袋里骨碌碌地滚了出来。", "流星在夜空中拖出长长的尾巴，落在了岳与岳之间。", "人们抬头望着流星许了愿，笑着说：“这座岛上还有这么美好的事呢。”"], "hareubang": ["石头爷爷守护的岛", "奶奶用指尖轻轻在空中一划，不知从哪里，石头爷爷（돌하르방）巍然现身。", "石头爷爷站在村口，替岛挡住了风和海浪。", "从那天起，济州的人们每次看到石头爷爷，就会想起雪门台奶奶的礼物。"], "haenyeo": ["奶奶的礼物：海女", "奶奶轻轻吹了一口气，伴着一声换气的口哨声，一位海女从海面上浮了出来。", "海女从深海里捞起了满满的鲍鱼和海螺。", "人们听着海女换气的口哨声，笑着说：“这座岛上还有这么能干的人呢。”"], "wind": ["奶奶的礼物：风", "奶奶用指尖轻轻在空中一划，不知从哪里，吹来了一阵清凉的风。", "风摇动了岳上的芒草，也推着海上的帆船前进。", "孩子们和风一起奔跑，决定要永远记住这座岛。"], "hallasan": ["洒在汉拿山上的阳光", "奶奶轻轻把裙子里的泥土堆起来，岛的正中间耸起了汉拿山。", "汉拿山把头探出云层，第一个迎接了清晨的阳光。", "孩子们抬头望着汉拿山，决定要永远记住这座岛。"], "baengnokdam": ["有白鹿潭的山", "奶奶用指尖轻轻抚摸汉拿山的山顶，一汪清水的白鹿潭出现了。", "白鹿潭映出了天空和云朵，一头白鹿来到潭边喝水。", "孩子们坐在白鹿潭旁，望着白鹿，决定要永远记住这座岛。"]}};   // 추천 단어 10개: 영어·일본어·중국어로 손으로 다듬은 장면 글 (제목 + 3문단)

       b:[`${w} rode the wind, passed between the oreum, and settled softly on a village rooftop.`,`${w} danced to the sound of the waves and circled the whole island.`,`${w} rose all the way to the top of Hallasan and lit up the entire island.`],
       c:[`The people looked up at ${w} and smiled, saying, "This island has such wonderful things."`,`The children played with ${w} and decided to remember this island for a very long time.`,`From that day on, whenever the people of Jeju saw ${w}, they remembered Grandmother Seolmundae's gift.`]},
   ja:{t:[`${w}が宿った島`,`ハルマンの贈りもの、${w}`,`${w}がやって来た日`],

       b:[`${w}は風にのって、オルムとオルムのあいだを通り、村の屋根の上にそっと降り立ちました。`,`${w}は波の音に合わせておどりながら、島をひとまわりしました。`,`${w}はハルラ山のてっぺんまでのぼって、島じゅうをあかるく照らしました。`],
       c:[`人々は${w}を見上げて、「この島には、こんなすてきなこともあるんだね」と笑いました。`,`子どもたちは${w}といっしょに遊びまわり、この島をいつまでも覚えていようと決めました。`,`その日から、済州の人々は${w}を見るたびに、ソルムンデハルマンの贈りものを思い出しました。`]},
   zh:{t:[`栖息着${w}的岛`,`奶奶的礼物：${w}`,`${w}到来的那一天`],
       a:[`奶奶用指尖轻轻在空中一划，不知从哪里，${w}闪闪发光地出现了。`,`奶奶轻轻吹了一口气，${w}悠悠地漂浮在海面上。`,`奶奶抖了抖裙子，${w}从口袋里骨碌碌地滚了出来。`],
       b:[`${w}乘着风，穿过一座座岳，轻轻落在了村子的屋顶上。`,`${w}随着海浪的声音翩翩起舞，绕着岛转了一圈。`,`${w}一直升到汉拿山的山顶，把整座岛照得亮堂堂的。`],
       c:[`人们抬头望着${w}，笑着说：“这座岛上还有这么美好的事呢。”`,`孩子们和${w}一起玩耍，决定要永远记住这座岛。`,`从那天起，济州的人们每次看到${w}，就会想起雪门台奶奶的礼物。`]}
  }[LANG];
  const el=pick(["flower","light","star","wind"],6);
  return {source:"local",title:pick(T.t,2),paragraphs:[pick(T.a,1),pick(T.b,3),pick(T.c,5)],mood:pick(["dawn","day","golden","dusk","night","mist"],4),element:el};
}

function applyLang(){
  document.documentElement.lang=LANG; document.title=U("title");
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=U(e.dataset.i));
  document.querySelectorAll("[data-ih]").forEach(e=>e.innerHTML=U(e.dataset.ih));
  $("hdr").textContent=U("hdr"); $("word").placeholder=U("ph"); $("word").setAttribute("aria-label",U("wordAria"));
  [["back","back"],["home","home"],["trail","path"]].forEach(([id,k])=>{$(id).title=U(k);$(id).setAttribute("aria-label",U(k))});
  document.querySelector(".meta").title=U("meta"); $("bgm").setAttribute("aria-label",U("bgmAria")); $("voice").setAttribute("aria-label",U("vcAria"));
  $("langbtn").setAttribute("aria-label",U("langAria")); $("langbtn").title=U("langAria"); $("langcur").textContent=LANGS.find(l=>l[0]===LANG)[1];
  $("chips").innerHTML=CHIPS_L[LANG].map(c=>`<button type="button">${c}</button>`).join("");
  $("langmenu").innerHTML=LANGS.map(([c,n])=>`<li><button type="button" role="menuitemradio" aria-checked="${c===LANG}" data-l="${c}"${c===LANG?' class="on"':""}>${n}</button></li>`).join("");
  showFound(); bgmBtn(); voiceBtn();
}
function setLang(l){

const SCN={"en":{"start":{"t":"Grandmother Seolmundae","x":["A very long time ago, Jeju was not an island. It was an endless stretch of blue sea.","In the middle of that sea, a goddess as tall as the sky slowly opened her eyes. Her name was Seolmundae Halmang, which means Grandmother Seolmundae.","This story has been told for ages, but where it goes this time is up to you."]},"c1_dark":{"t":"When Sky and Earth Were Stuck Together","x":["The world was completely dark. Sky and earth were stuck together in one big lump, so not a ray of light or a breath of wind could squeeze in.","Grandmother woke in the darkness and blinked. Her eyes were huge and warm, unlike any eyes anyone had ever seen.","\"It's so stuffy in here. Why is this world so cramped?\" she murmured."],"ch":["Chapter 1","The Sea With No Name"]},"c1_listen":{"t":"A Sound in the Dark","x":["She listened closely, and from far away came a soft \"swoosh, swoosh.\" Beneath the darkness, an endless sea was rolling.","The sound seemed to call, \"Here! Over here!\" Grandmother's heart began to pound.","\"I wonder what's up there?\" Her curiosity turned into courage, and strength filled her arms."]},"c1_push":{"t":"The Sky Opens","x":["Grandmother put both hands against the sky and pushed with all her might. Rumble, crash! Sky and earth split apart, and a crack ran through the dark.","The very first light poured through the gap. Golden light danced on the waves, and the sea showed its true color for the first time.","Far away, a horizon was drawn, and above it the sky spread out, high and wide."]},"c1_feel":{"t":"The First Morning","x":["The light was warm. Its warmth settled softly on Grandmother's cheeks, shoulders, and toes.","\"Ah, so this is what morning feels like.\" She couldn't help smiling. Even though she was alone, it was a morning without any loneliness.","The sparkles on the sea seemed to be waving hello to her."]},"c1_walk":{"t":"Walking Through the Sea","x":["Splash, splash. With every step Grandmother took, waves broke around her ankles. Even the deepest sea only came up to her knees.","After walking for a long time, she suddenly stopped. There was only water in every direction, and not one patch of ground to stand on.","\"I wish I had a place to rest. No, a place where someone else could rest too would be even better.\""]},"c2_dive":{"t":"Soil from the Sea Floor","x":["Grandmother reached deep into the water and touched the world beneath the sea: shiny shells, swaying seaweed, and firm, warm soil.","\"This will do!\" she said. She scooped up handful after handful of soil. Little fish darted away in fright from between her fingers."],"ch":["Chapter 2","Making the Island"]},"c2_soil":{"t":"A Skirt Full of Soil","x":["Grandmother spread out her skirt and filled it with soil from the sea floor. The skirt bulged, and the soil sloshed with every step.","When she reached the middle of the sea, she carefully began to tip her skirt.","\"What shape shall I make?\""],"ch":["Chapter 2","Making the Island"]},"c2_tall":{"t":"The Mountain That Touched the Sky","x":["The soil piled up higher and higher. The mountain that rose through the clouds and nearly touched the sky is Hallasan.","At its peak was a hollow that would later fill with clear water and be called Baengnokdam.","Grandmother shaded her eyes with her hand, looked up at it, and smiled proudly."]},"c2_soft":{"t":"A Mountain Like a Mother's Arms","x":["Grandmother patted the soil gently with her palms. Hallasan came out broad and gentle, not steep.","Its embrace was so wide that people would later call Hallasan \"Mother's Mountain.\"","Grandmother stroked the finished mountain and hummed quietly."]},"c2_orum":{"t":"More Than Three Hundred Sixty Oreum","x":["Grandmother shook out her skirt, and the leftover soil scattered across the island. But her skirt was old and full of holes, and soil trickled out as she walked.","The soil that trickled out became small, round hills all over the island. There were more than three hundred sixty of them. These are Jeju's oreum, its little volcanic hills.","Grandmother looked at them one by one and smiled happily."]},"c2_name":{"t":"Oreum Get Their Names","x":["\"You are Dalangswi, you are Yongnuni, you are Saebyeol!\" Each time Grandmother called a name, that oreum seemed to puff up with pride.","The named oreum each had their own shape and look, and together they filled the island. Now that they had names, anyone could come and find them.","The island was no longer a land without a name."]},"c2_seed":{"t":"An Island in Bloom","x":["Grandmother scattered flower seeds from her fingertips. Yellow canola flowers rolled out like waves, and red camellias bloomed like flames.","A different flower bloomed on each oreum, and the island became as lovely as an embroidered cloth.","The wind carried the petals and drifted gently out over the sea."]},"c2_rest":{"t":"Resting Her Head on the Mountain","x":["When her work was done, Grandmother lay down with the peak of Hallasan as her pillow. She rested her feet on Gwantal Island across the sea.","A soft mountain, a warm breeze, and stars twinkling on one by one. For the first time in a long while, she let out a deep breath.","\"This really is a wonderful island.\""]},"c2_splash":{"t":"Splish, Splash","x":["Splash! Grandmother kicked her feet, the sea surged, and the flying drops scattered like stars across the island.","Wherever the drops landed, clear springs bubbled up. It was precious water for the people who would come later.","Grandmother giggled and kicked once more."]},"c2_sky":{"t":"A Night of Counting Stars","x":["One, two, three... Each time Grandmother counted a star, a ribbon of starlight settled on the island.","\"If someone ever comes to this island, I'll count these stars with them,\" she whispered like a wish.","Just then, a shooting star drew a long tail across the sky and fell into the sea."]},"c3_people":{"t":"People Come to the Island","x":["Time passed, and people began to arrive on the island one by one. Thatched houses rose at the feet of the oreum, and evening smoke curled from every chimney.","At first the people were afraid of Grandmother, who was as big as a mountain. But when she smiled warmly, they soon gathered around her.","They built stone walls and worked the fields, and the island slowly grew warm with the smell of people."],"ch":["Chapter 3","People Come to the Island"]},"c3_listen":{"t":"Stories in the Evening Yard","x":["Grandmother bent down low and listened to the people's stories. There were stories about fishing at sea, about building stone walls, and about putting children to sleep on windy nights.","The more she listened, the more she understood how precious the island was.","The sound of the people's laughter spread warmly among the oreum."]},"c3_palm":{"t":"On Grandmother's Palm","x":["When Grandmother held out her huge palm, the people climbed on carefully. She lifted her hand high into the sky.","\"Look, the sunlight is breaking into pieces on the waves!\" The people gasped at their first view of the island.","The children never forgot the day when the oreum and the sea spread out before them all at once."]},"c3_wish":{"t":"A Bridge to the Mainland","x":["When Grandmother asked what they wished for, the people gathered and said together, \"Grandmother, we miss the mainland. Could you build us a bridge across the sea?\"","Grandmother thought for a moment and said, \"Very well. If you make me new underclothes from one hundred bolts of silk, I will build you a strong bridge all the way to the mainland.\""]},"c3_silk":{"t":"One Bolt at a Time","x":["Each village began to collect silk. One bolt, two bolts... Every household brought out the fine cloth they had saved.","But the closer they got, the harder it became. Ninety bolts, ninety-six bolts... At last they had ninety-nine.","Only one last bolt was missing."]},"c3_weave":{"t":"The Last Bolt, Woven All Night","x":["The people lit lamps and sat in a circle weaving through the night. The children held the thread, the grown-ups threw the shuttle, and the elders sang.","Just before dawn, the last bolt was finished at last. All one hundred bolts were complete!","The people joined hands and cheered. Now it was time to lay the promised cloth before Grandmother."]},"c3_ninety":{"t":"The Promise of Ninety-Nine Bolts","x":["Ninety-nine bolts of silk were piled up before Grandmother. She set to work sewing her underclothes with great care, but she was one bolt short and never finished them.","Grandmother smiled with a little regret. Still, the people's effort had reached her heart.","A promise is a promise, so she gazed quietly out at the distant sea."]},"c4_sons":{"t":"The Year of Famine","x":["Grandmother had five hundred sons. They were mischievous and big eaters, but to her they were the most precious treasures in the world.","Then one year a terrible famine struck. The crops in the fields withered, and her sons cried from hunger.","Grandmother decided to hang a huge cauldron at the foot of the mountain and cook porridge."],"ch":["Chapter 3","The Story of the Five Hundred Sons"]},"c4_pot":{"t":"The Steaming Cauldron","x":["Grandmother rolled up her sleeves and stirred the pot. Steam rose, and the rich smell drifted over the mountain.","She stirred so hard that her foot slipped, and she fell right into the giant cauldron.","Porridge was bubbling inside, and from the mountain came the sound of her sons returning."]},"c4_together":{"t":"Porridge Cooked Together","x":["Grandmother called out loudly to her sons. All five hundred came rushing down. One lit the fire, one fetched water, and one stirred the pot.","With so many hands, the porridge was ready in no time, and no one got hurt.","The rich smell drifted all the way to the village, and the neighbors came with bowls in their hands."]},"ai":{"t":"Grandmother's Last Wish","x":["Grandmother looked up at the sky and said,","\"I would like to place one last thing on this island. You tell me. What would you like to have here?\"","Say just one word, and a brand-new scene of the story will be drawn."],"ch":["The Last Chapter","A Scene You Wrote"],"v":{"e_stones":["From inside the cauldron, Grandmother's faint voice could be heard.","\"Children... I would like to leave one last thing on this island. You tell me. What would you like to have here?\"","Say just one word, and a brand-new scene of the story will be drawn."]}},"e_bridge":{"t":"The Road That Connected","x":["Grandmother put on her new underclothes and smiled brightly. Then, as promised, she placed stones on the sea, one step and then another, and began to connect a road.","On the day Jeju first touched the mainland, people hugged each other and danced. The island was no longer lonely.","In the old tale, the bridge is never built because one bolt is missing. But in the story you took part in, the people joined forces and filled in that last bolt."]},"e_ninety":{"t":"The Missing Bolt","x":["Because one bolt was missing, the underclothes were never finished, and Grandmother stopped building the bridge. That is why Jeju is said to remain an island surrounded by the sea.","Perhaps it was because of that one missing bolt that Jeju's own wind, stones, and stories have been kept safe for so long.","Some stories are more beautiful because something is missing."]},"e_stones":{"t":"The Five Hundred Generals","x":["The sons came home not knowing their mother had fallen into the pot, and they ate the porridge happily. Then the youngest, at the very end, found a trace of their mother at the bottom of the cauldron.","The sons fell into deep sorrow, and in the Yeongsil Valley of Hallasan they froze where they stood and turned to stone. They say the Five Hundred Generals Rocks still stand guard beside the oreum.","Grandmother's love became rock, and it protects the island to this day."]},"e_porridge":{"t":"Porridge Cooked Together","x":["Warm porridge filled five hundred bowls, and bright lights glowed all along the foot of the mountain. The sons and neighbors ate until they were full, then sat around Grandmother chatting happily.","That day, the island learned that even a night of famine grows warm when people are together.","This is an ending you wrote together with us."]},"e_star":{"t":"A Road Made of Stars","x":["The last bolt was woven from starlight. A curious child looked up and wondered, \"Where does this thread come from?\" and followed a strand of starlight and hung it on the loom.","When Grandmother put on her new underclothes and smiled, the bridge was laid not across the sea but across the sky, where the stars flow. It was a road that reached the mainland and also faraway islands no one had visited yet.","That day, Jeju learned that curiosity can build a road. This is a hidden ending you opened with your curiosity."]},"e_boat":{"t":"Crossing the Sea by Themselves","x":["Ninety-nine bolts of silk were not enough to finish the underclothes, and the bridge could not be built. The people hung their heads for a while.","Then one person stepped forward. \"If there's no bridge, we can build boats!\" The silk became sails, and the trees of the oreum became ships.","The brave people pushed through the waves and reached the mainland by themselves. Grandmother waved her hand and blew the wind to push their sails. This is a hidden ending you opened with your courage."]},"e_mountain":{"t":"The Grandmother Who Became a Mountain","x":["Grandmother, who had fallen into the porridge pot, never came back. The sons returned and cried in front of the cauldron for a very long time.","Their tears soaked the ground, and Grandmother's warm heart seeped into the soil. Hallasan took one deep breath, and green grass sprouted on every oreum.","The sons did not turn to stone. They became the wind that guards the mountain. They say that is why Hallasan still feels as warm as a mother's embrace today. This is a hidden ending you opened with your warm heart."]},"e_flavors":{"t":"Five Hundred Flavors of Porridge","x":["The five hundred sons and the neighbors were all very curious. \"I wonder what it will taste like if I add this?\" One added canola flowers, one added camellia leaves, one added seaweed pulled from the sea, and another added sweet and sour tangerines.","Every spoonful of porridge tasted different. Some were sweet, some savory, some salty, some fragrant. The night of famine suddenly became as lively as a festival.","Curiosity about new things made the warmest meal of all. This is a hidden ending you opened with your curiosity."]}},"ja":{"start":{"t":"ソルムンデハルマン","x":["ずっとずっと昔、済州（チェジュ）は島ではなく、果てしなく広がる青い海でした。","その海のまんなかで、空ほども背の高い女神、ソルムンデハルマンがゆっくりと目を開けました。","このお話はとっくの昔から語り継がれていますが、今回のお話がどこへ流れていくかは、あなたが選びます。"]},"c1_dark":{"t":"天と地がくっついていたころ","x":["世界はまっ暗でした。天と地がひとつのかたまりになってくっついていて、光ひとすじ、風ひとつ入るすき間もありません。","その暗やみの中で目をさましたハルマンは、まばたきをしました。誰も見たことのない、大きくてあたたかい目でした。","「息苦しいねえ。この世界はどうしてこんなにせまいのかしら？」ハルマンは小さくつぶやきました。"],"ch":["第1章","まだ名前のなかった海"]},"c1_listen":{"t":"暗やみの中の音","x":["耳をすますと、とても遠くから「ざあ」という音が聞こえました。暗やみの下では、果てしない水がゆれていたのです。","その音は「ここだよ、ここ！」と呼んでいるようでした。ハルマンの胸がどきどきしはじめました。","「あの上には何があるのかしら？」知りたい気持ちが勇気になって、ハルマンの腕に力がみなぎりました。"]},"c1_push":{"t":"空が開く","x":["ハルマンは両手で、力いっぱい空を押し上げました。ごごごっ、ずしん！ 天と地が割れて、暗やみにひびが入りました。","そのすき間から、最初の光がふり注ぎました。金色の光が波の上でゆらゆら輝き、海ははじめて自分の色を見せました。","ずっと遠くに水平線が引かれ、その上に、高くて広い空がぱあっと広がりました。"]},"c1_feel":{"t":"はじめての朝","x":["光はあたたかでした。ハルマンのほお、肩、足のつま先に、ぽかぽかしたぬくもりが降りてきました。","「ああ、これが朝というものなのね。」ハルマンは思わず笑顔になりました。ひとりぼっちでも、さびしくない朝でした。","海の上できらきら光る波は、ハルマンにあいさつしているようでした。"]},"c1_walk":{"t":"海を歩く","x":["ぴちゃ、ぴちゃ。ハルマンが歩くたびに、波が足首でくだけました。どんなに深い海も、ハルマンのひざまでしかありません。","しばらく歩いたハルマンは、ふと足を止めました。まわりは見わたすかぎり水ばかりで、足をおろせる地面はひとつもありません。","「休める場所があるといいわね。ううん、わたしだけじゃなくて、ほかの誰かも休める場所なら、もっといいわ。」"]},"c2_dive":{"t":"海の底の土","x":["ハルマンが腕を深く海に入れると、指先に海の底の世界がふれました。きらきら光る貝、ゆらゆらゆれる海藻、そしてかたくてあたたかい土。","「これならいいわ！」ハルマンはひとすくい、またひとすくいと、土をすくい上げました。手のひらのすき間から、小さな魚たちがびっくりして逃げていきました。"],"ch":["第2章","島をつくる"]},"c2_soil":{"t":"スカートいっぱいの土","x":["ハルマンはスカートを広げて、海の底の土をいっぱいに包みました。スカートはふくらんで、歩くたびに土がゆらゆらゆれました。","海のまんなかまで来ると、ハルマンはそうっとスカートをかたむけはじめました。","「どんな形にしようかしら？」"],"ch":["第2章","島をつくる"]},"c2_tall":{"t":"空に届きそうな山","x":["土の山はぐんぐん高くなりました。雲をつきぬけ、空に届きそうなほど高くそびえたその山が、ハルラ山（漢拏山）です。","山のてっぺんにはくぼみができて、のちに澄んだ水がたまり、ペンノクダム（白鹿潭）と呼ばれるようになります。","ハルマンはひたいに手をあてて見上げ、誇らしげに笑いました。"]},"c2_soft":{"t":"お母さんの胸のような山","x":["ハルマンは手のひらで土をぽんぽんとたたいてならしました。急ではなく、ゆったりと裾野を広げたハルラ山ができあがりました。","その胸はとても広く、のちに人々はハルラ山を「お母さんの山」と呼ぶようになります。","ハルマンは、できあがった山をなでながら、小さく鼻歌を歌いました。"]},"c2_orum":{"t":"三百六十あまりのオルム","x":["ハルマンがスカートをぱたぱたとはたくと、残った土が島のあちこちに散らばりました。ところで、長いあいだ着ていたハルマンのスカートは、ところどころに穴があいていました。歩きまわるうちに、その穴から土がさらさらとこぼれ落ちたのです。","こぼれた土は、島のすみずみで小さくて丸い峰になりました。その数、なんと三百六十あまり。これが済州のオルム（小さな火山の丘）です。","ハルマンはオルムをひとつひとつ見てまわり、にこにこと満足そうに笑いました。"]},"c2_name":{"t":"名前をもらったオルム","x":["「あなたはタランシ、あなたはヨンヌニ、あなたはセビョル！」ハルマンが名前を呼ぶたびに、オルムは誇らしげにぐんと背をのばしたようでした。","名前をもらったオルムたちは、それぞれちがう形と表情で、島をいっぱいに満たしました。名前があれば、これからは誰でも会いに来られます。","島はもう、名前のない土地ではありませんでした。"]},"c2_seed":{"t":"花が咲く島","x":["ハルマンが指先で花の種をまくと、黄色い菜の花が波のように広がり、赤い椿が炎のように咲きました。","オルムごとにちがう花が咲いて、島は一枚の刺しゅうの風呂敷のように美しくなりました。","風が花びらをのせて、海の上をふわりふわりと飛んでいきました。"]},"c2_rest":{"t":"山をまくらに横になる","x":["仕事を終えたハルマンは、ハルラ山の頂をまくらにして、長々と横になりました。両足は、海のむこうの冠脱島（クァンタルソム）にのせました。","やわらかな山、あたたかな風、ひとつふたつと灯りはじめる星。ハルマンは久しぶりに、ふうっと深く息をつきました。","「これなら本当にいい島ね。」"]},"c2_splash":{"t":"ばしゃばしゃ水遊び","x":["ばしゃん！ ハルマンが足をばたつかせると、海が大きくゆれて、はねあがった水しぶきが星のように島のあちこちに散りました。","水しぶきが落ちた場所には、そのたびに澄んだ泉がこんこんとわき出しました。のちに人々が飲む、大切な水でした。","ハルマンはけらけら笑って、もう一度足をばたつかせました。"]},"c2_sky":{"t":"星を数える夜","x":["ひとつ、ふたつ、みっつ…。ハルマンが星を数えるたびに、星の光がひとすじずつ、島の上に降りてきました。","「いつかこの島に誰かが来たら、いっしょにこの星を数えてあげなくちゃ。」ハルマンは願いごとのようにつぶやきました。","そのとき、流れ星がひとつ、長い尾を引いて海に落ちていきました。"]},"c3_people":{"t":"島に来た人たち","x":["時がたつにつれて、島にひとり、またひとりと人がやって来ました。オルムのふもとにわらぶき屋根の家が建ち、どの煙突からも夕方になると煙が立ちのぼりました。","人々は、山のように大きなハルマンを見上げて、はじめはこわがっていました。けれどハルマンがにっこり笑うと、いつのまにかそばに集まってきました。","石垣を積み、畑を耕しているうちに、島はだんだん人のぬくもりでいっぱいになりました。"],"ch":["第3章","島に来た人たち"]},"c3_listen":{"t":"夕方の庭で聞くお話","x":["ハルマンは身をかがめて、人々の話を聞きました。海で魚をとる話、石垣を積む話、風の強い夜に子どもを寝かしつける話。","話を聞けば聞くほど、ハルマンはこの島がどれほど大切かに気づきました。","人々の笑い声が、オルムのあいだにあたたかく広がっていきました。"]},"c3_palm":{"t":"ハルマンの手のひらの上で","x":["ハルマンが大きな手のひらをさし出すと、人々はおそるおそる乗りこみました。ハルマンは手を空高く持ち上げました。","「見て、波の上で光がきらきらくだけているよ！」人々は、はじめて見る島の姿に歓声を上げました。","オルムも海も一望できたその日のことを、子どもたちはいつまでも忘れませんでした。"]},"c3_wish":{"t":"陸へ渡る橋","x":["ハルマンが願いごとをたずねると、人々は集まって声をそろえて言いました。「ハルマン、わたしたちは陸が恋しいのです。海をわたる橋をかけていただけませんか？」","ハルマンはしばらく考えてから言いました。「いいでしょう。わたしの古い下着を、絹百反で新しく仕立ててくれたら、陸まで丈夫な橋をかけてあげましょう。」"]},"c3_silk":{"t":"一反、また一反","x":["村ごとに絹を集めはじめました。一反、二反…どの家も、大事にしまっておいた上等の布を出しました。","けれど日がたつにつれて、集めるのがむずかしくなりました。九十反、九十六反…とうとう九十九反まで集まりました。","あとはたった一反、最後の一反だけが足りません。"]},"c3_weave":{"t":"夜通し織った最後の一反","x":["人々は灯りをともし、輪になって夜通し機を織りました。子どもは糸を持ち、大人は杼（ひ）を投げ、お年寄りは歌をうたいました。","夜が明けるころ、ついに最後の一反が織りあがりました。百反が、すべてそろったのです。","人々は手をとりあって歓声を上げました。さあ、約束の布をハルマンの前に広げるときです。"]},"c3_ninety":{"t":"九十九反の約束","x":["九十九反の絹が、ハルマンの前に積まれました。ハルマンは一生けんめい下着を縫いはじめましたが、一反足りなくて、とうとう仕上げることができませんでした。","ハルマンは残念そうにほほえみました。それでも、人々の真心は十分に伝わっていました。","約束は約束だったので、ハルマンは静かに遠い海を見つめました。"]},"c4_sons":{"t":"飢饉の年","x":["ハルマンには五百人の息子がいました。いたずらっ子で食いしんぼうでしたが、ハルマンにとっては世界でいちばん大切な宝物でした。","ところがある年、ひどい飢饉がおとずれました。畑の作物はかれ、息子たちはおなかがすいたと泣きそうな顔をしていました。","ハルマンは山のふもとに大きな釜をかけて、おかゆを炊くことにしました。"],"ch":["第3章","五百人の息子たちの話"]},"c4_pot":{"t":"湯気がのぼる大釜","x":["ハルマンは腕まくりをして釜をかきまぜました。湯気がほかほかとのぼり、おいしそうなにおいが山を越えていきました。","かきまぜるのに夢中になりすぎたハルマンは、うっかり足をすべらせて、大きな釜の中に落ちてしまいました。","釜の中ではおかゆがぐつぐつ煮えていて、山からは息子たちが帰ってくる音が聞こえてきました。"]},"c4_together":{"t":"みんなで炊いたおかゆ","x":["ハルマンが大きな声で息子たちを呼びました。五百人の息子がどやどやと駆けつけて、ひとりは火をおこし、ひとりは水をくみ、またひとりは釜をかきまぜました。","たくさんの手が集まると、おかゆはあっというまに煮えて、誰もけがをしませんでした。","おいしそうなにおいが村まで広がって、近所の人たちも器を持って集まってきました。"]},"ai":{"t":"ハルマンの最後のお願い","x":["ハルマンは空を見上げて言いました。","「この島に、最後にもうひとつだけ置きたいものがあるのよ。あなたが教えてちょうだい。何があったらいいと思う？」","あなたが言葉をひとつ言うと、お話の新しい一場面が描かれます。"],"ch":["最後の章","あなたがつくる一場面"],"v":{"e_stones":["釜の中から、ハルマンのかすかな声が聞こえてきました。","「みんな…この島に、最後にもうひとつだけ残したいのよ。あなたが教えてちょうだい。何があったらいいと思う？」","あなたが言葉をひとつ言うと、お話の新しい一場面が描かれます。"]}},"e_bridge":{"t":"つながった道","x":["ハルマンは新しい下着を着て、にっこり笑いました。そして約束どおり、海の上に一歩、また一歩と石を置いて、道をつなげていきました。","済州と陸がはじめてふれあったその日、人々は抱きあっておどりました。島はもう、さびしくありませんでした。","伝わっているお話では、たった一反足りなくて橋がかかりません。でも、あなたがいっしょに歩んだお話では、人々が力を合わせて、その一反を満たしたのです。"]},"e_ninety":{"t":"足りなかった一反","x":["一反足りなくて、下着はとうとう仕上がらず、ハルマンは橋をかけるのをやめました。だから済州は、海に囲まれた島のままなのだと伝えられています。","もしかすると、その足りなかった一反のおかげで、済州だけの風や石やお話が、いつまでも守られてきたのかもしれません。","足りないからこそ美しいお話も、あるのですから。"]},"e_stones":{"t":"五百将軍","x":["釜に落ちたお母さんを知らずに帰ってきた息子たちは、おかゆをおいしく食べました。ところが、いちばん最後に末の息子が、釜の底にお母さんの跡を見つけました。","息子たちは深い悲しみに沈み、ハルラ山の霊室（ヨンシル）渓谷で、そのまま固まって石になったといいます。今もオルムのそばには、五百将軍の岩が立っています。","ハルマンの愛はこうして岩になり、今日も島を守りつづけているのです。"]},"e_porridge":{"t":"いっしょに炊いたおかゆ","x":["五百の器にあつあつのおかゆがもられ、山のふもとのあちこちにあかるい灯りがともりました。息子たちと近所の人たちは、おなかいっぱい食べて、ハルマンのそばに輪になって、わいわいとおしゃべりをしました。","いっしょにいれば、飢饉の夜もあたたかくなることを、その日、島は知りました。","これは、あなたがいっしょに書き上げた結末です。"]},"e_star":{"t":"星でつながった道","x":["最後の一反は、夜空の星の光で織られました。好奇心いっぱいの子どもが「この糸はどこから来たんだろう？」と見上げて、星の光のひとすじをたどり、機にかけたのです。","ハルマンが新しい下着を着て笑うと、橋は海の上ではなく、星が流れる空にかかりました。陸にも、まだ行ったことのない遠い島にも届く道でした。","知りたいと思う心が道をつくることを、その日、済州は知りました。これは、あなたが好奇心で開いた、かくれた結末です。"]},"e_boat":{"t":"自分たちで渡った海","x":["九十九反の絹では下着はどうしても仕上がらず、橋はかかりませんでした。人々はしばらくのあいだ、うつむいていました。","そのとき、ひとりが前に進み出ました。「橋がないなら、船をつくればいいじゃないか！」絹は帆になり、オルムの木は船になりました。","勇気を出した人々は波をかきわけ、自分たちの力で陸にたどりつきました。ハルマンは手をふって、風を吹かせ、帆を押してあげました。これは、あなたが勇気で開いた、かくれた結末です。"]},"e_mountain":{"t":"山になったハルマン","x":["おかゆの釜に落ちたハルマンは、ついに戻ってきませんでした。帰ってきた息子たちは、釜の前で、いつまでも泣きつづけました。","その涙が大地をぬらすと、ハルマンのあたたかな心が土の中にしみこんでいきました。ハルラ山がひとつ大きく息をして、オルムというオルムに、青い草が芽ぶきました。","息子たちは石になるかわりに、山を守る風になりました。今でもハルラ山がお母さんの胸のようにぽかぽかと心地よいのは、そのためだといいます。これは、あなたがあたたかな心で開いた、かくれた結末です。"]},"e_flavors":{"t":"五百の味のおかゆ","x":["五百人の息子と近所の人たちは、みんな好奇心でいっぱいでした。「これを入れたら、どんな味になるかな？」ひとりは菜の花を、ひとりは椿の葉を、またひとりは海でとってきたわかめを、もうひとりは甘ずっぱいみかんを、釜に入れました。","おかゆはひと口ごとに味がちがいました。甘くて、香ばしくて、しょっぱくて、いい香りがしました。飢饉の夜が、とつぜんお祭りのようににぎやかになりました。","新しいものを知りたいと思う心が、いちばんあたたかい食卓をつくりました。これは、あなたが好奇心で開いた、かくれた結末です。"]}},"zh":{"start":{"t":"雪门台奶奶（설문대할망）","x":["很久很久以前，济州还不是岛，只是一片望不到头的蓝色大海。","在大海中央，一位个子和天一样高的女神——雪门台奶奶，慢慢睁开了眼睛。","这个故事早就流传了很久，可这一次故事会往哪里走，由你来选。"]},"c1_dark":{"t":"天和地粘在一起的时候","x":["那时候，世界一片漆黑。天和地紧紧粘成一整块，连一丝光、一点风都钻不进来。","奶奶在黑暗中醒来，眨了眨眼睛。那是一双谁也没见过的、又大又温暖的眼睛。","“好闷啊。这个世界怎么这么挤呢？”奶奶小声嘀咕。"],"ch":["第一章","还没有名字的大海"]},"c1_listen":{"t":"黑暗中的声音","x":["她侧耳细听，远远传来“哗——哗——”的声音。原来黑暗下面，有一片无边无际的水在翻涌。","那声音好像在喊：“在这儿！在这儿！”奶奶的心怦怦直跳。","“上面会有什么呢？”好奇变成了勇气，奶奶的手臂一下子充满了力气。"]},"c1_push":{"t":"天被推开了","x":["奶奶用双手使出全身力气，把天往上一推。轰隆隆！天和地裂开了，黑暗出现了一道缝。","第一缕光从缝里倾泻下来。金色的光在海浪上闪动，大海第一次露出了自己的颜色。","很远很远的地方画出了一条地平线，地平线上方，又高又广的天空豁然展开。"]},"c1_feel":{"t":"第一个早晨","x":["阳光暖暖的。暖意轻轻落在奶奶的脸颊、肩膀和脚尖上。","“啊，原来这就是早晨啊。”奶奶忍不住笑了出来。这是一个就算只有自己一个人，也不觉得孤单的早晨。","海面上闪闪发亮的波光，好像在跟奶奶打招呼。"]},"c1_walk":{"t":"在海里散步","x":["哗啦，哗啦。奶奶每走一步，海浪就在脚踝边碎开。再深的海，也只到奶奶的膝盖。","走了好久，奶奶忽然停下了脚步。四面八方全是水，连一块可以落脚的地方都没有。","“要是有个地方能歇歇脚就好了。不对，要是别人也能在那里休息，就更好了。”"]},"c2_dive":{"t":"海底的泥土","x":["奶奶把手臂深深伸进海里，指尖碰到了海底的世界：闪亮的贝壳、轻轻摇摆的海草，还有结实又温暖的泥土。","“这个就行！”奶奶一捧又一捧，把泥土捞了上来。小鱼们从她的手掌缝里吓得四处逃窜。"],"ch":["第二章","造出岛屿"]},"c2_soil":{"t":"裙子里装满泥土","x":["奶奶撑开裙摆，把海底的泥土装得满满的。裙子鼓了起来，每走一步，泥土都晃来晃去。","走到大海中央，奶奶小心翼翼地把裙子慢慢倾斜。","“该堆成什么样子呢？”"],"ch":["第二章","造出岛屿"]},"c2_tall":{"t":"高耸入云的山","x":["泥土堆呀堆，越堆越高。那座穿过云层、几乎碰到天的山，就是汉拿山。","山顶有一个凹下去的地方，后来积满了清澈的水，被人们叫做白鹿潭。","奶奶把手搭在额头上，抬头望着它，满意地笑了。"]},"c2_soft":{"t":"像妈妈怀抱一样的山","x":["奶奶用手掌把泥土轻轻拍实。汉拿山不陡峭，山势宽广又舒缓。","它的怀抱那么宽厚，后来人们就把汉拿山叫做“妈妈的山”。","奶奶一边抚摸着刚做好的山，一边轻轻哼起了歌。"]},"c2_orum":{"t":"三百六十多座岳（오름）","x":["奶奶把裙子抖了抖，剩下的泥土撒落在岛上各个角落。可是奶奶的裙子穿了很久，到处都是破洞。她走来走去的时候，泥土就从洞里一点一点漏了出来。","漏出来的泥土，在岛上的各个角落变成了圆圆的小山包。一共有三百六十多座，这就是济州的“岳”（오름，是济州特有的小山丘）。","奶奶一座一座地看过去，开心地笑了。"]},"c2_name":{"t":"有了名字的岳","x":["“你叫多郎时，你叫龙眼，你叫新星！”奶奶每叫一个名字，那座岳就好像得意地往上蹿一蹿。","有了名字的岳们，各有各的模样和表情，把整个岛装点得满满的。有了名字，以后谁都能找到它们。","这座岛，再也不是没有名字的荒地了。"]},"c2_seed":{"t":"开满花的岛","x":["奶奶用指尖撒下花种，黄色的油菜花像波浪一样一片片铺开，红色的山茶花像火焰一样绽放。","每座岳上开着不同的花，整个岛美得像一块绣满花的包袱布。","风带着花瓣，轻轻飘过了大海。"]},"c2_rest":{"t":"枕着山躺下","x":["忙完以后，奶奶把汉拿山的山顶当成枕头，舒舒服服地躺了下来。她的双脚，搭在海对面的冠脱岛上。","软软的山，暖暖的风，一颗一颗亮起来的星星。奶奶好久没有这样深深地舒了一口气。","“这真是一座好岛啊。”"]},"c2_splash":{"t":"扑通扑通玩水","x":["扑通！奶奶一踢脚，海水翻起大浪，溅起的水珠像星星一样洒落在岛上各处。","水珠落下的地方，一眼一眼清清的泉水咕嘟咕嘟冒了出来。这是留给后来的人们喝的宝贵的水。","奶奶咯咯地笑着，又踢了一脚。"]},"c2_sky":{"t":"数星星的夜晚","x":["一颗，两颗，三颗……奶奶每数一颗星星，就有一缕星光落在岛上。","“要是以后有人来到这座岛上，我要和他们一起数这些星星。”奶奶像许愿一样轻声说。","这时，一颗流星拖着长长的尾巴，划过天空，落进了大海。"]},"c3_people":{"t":"来到岛上的人们","x":["时间一天天过去，岛上陆陆续续来了人。岳的脚下盖起了茅草屋，每家的烟囱在傍晚都冒出了炊烟。","人们抬头看着像山一样高大的奶奶，一开始有点害怕。可是奶奶笑得那么亲切，不知不觉，大家就围到了她身边。","大家垒石墙、开田地，岛上渐渐有了人间的烟火味，变得暖烘烘的。"],"ch":["第三章","来到岛上的人们"]},"c3_listen":{"t":"傍晚院子里的故事","x":["奶奶弯下身子，听大家讲故事。有出海捕鱼的故事，有垒石墙的故事，还有大风夜里哄孩子睡觉的故事。","越听，奶奶越明白这座岛有多么珍贵。","人们的笑声在岳与岳之间，暖暖地传开了。"]},"c3_palm":{"t":"在奶奶的手掌上","x":["奶奶伸出大大的手掌，人们小心翼翼地爬了上去。奶奶把手高高地举向天空。","“快看，阳光在海浪上碎成一片片呢！”人们第一次看到岛的全貌，忍不住连连惊叹。","岳和大海一眼望尽的那一天，孩子们好久好久都忘不了。"]},"c3_wish":{"t":"通往大陆的桥","x":["奶奶问大家有什么心愿，人们聚在一起，异口同声地说：“奶奶，我们想念大陆。您能为我们在海上架一座桥吗？”","奶奶想了想说：“好啊。你们要是给我用一百匹丝绸，缝一件新内衣，我就给你们修一座通到大陆的结实大桥。”"]},"c3_silk":{"t":"一匹一匹地凑","x":["各个村子开始收集丝绸。一匹，两匹……家家户户把舍不得用的好布都拿了出来。","可是越到后面，越难凑。九十匹，九十六匹……终于凑到了九十九匹。","现在只差最后一匹了。"]},"c3_weave":{"t":"连夜织出的最后一匹","x":["人们点起灯，围坐在一起，通宵织布。孩子拉线，大人投梭，老人唱歌。","天快亮的时候，最后一匹终于织好了。一百匹，全齐了！","人们手拉着手，欢呼起来。现在，该把承诺的布摆到奶奶面前了。"]},"c3_ninety":{"t":"九十九匹的约定","x":["九十九匹丝绸堆在了奶奶面前。奶奶认真地开始缝内衣，可是少了一匹，到最后也没能缝完。","奶奶有点遗憾地笑了笑。不过，人们的心意已经足够传达到了。","约定就是约定，奶奶静静地望向了远方的大海。"]},"c4_sons":{"t":"闹饥荒的那一年","x":["奶奶有五百个儿子。他们调皮捣蛋，还特别能吃，可在奶奶心里，他们是世界上最珍贵的宝贝。","可是有一年，发生了严重的饥荒。田里的庄稼都枯死了，儿子们饿得直哭。","奶奶决定在山脚下架起一口大锅，给他们煮粥。"],"ch":["第三章","五百个儿子的故事"]},"c4_pot":{"t":"热气腾腾的大锅","x":["奶奶挽起袖子搅着锅。热气腾腾，香喷喷的味道飘过了山头。","奶奶搅得太用力，脚一滑，一下子掉进了那口巨大的锅里。","锅里的粥正咕嘟咕嘟地煮着，山上传来了儿子们回来的脚步声。"]},"c4_together":{"t":"大家一起煮的粥","x":["奶奶大声呼唤儿子们。五百个儿子呼啦啦地跑了过来，有的生火，有的打水，有的搅锅。","人多力量大，粥很快就煮好了，也没有人受伤。","香香的味道一直飘到了村子里，邻居们也端着碗聚了过来。"]},"ai":{"t":"奶奶最后的请求","x":["奶奶抬头望着天空说：","“我想在这座岛上，最后再放一样东西。你来告诉我吧，你希望有什么呢？”","只要你说出一个词，故事里就会多出一个全新的场景。"],"ch":["最后一章","你写下的一个场景"],"v":{"e_stones":["锅里传来了奶奶微弱的声音。","“孩子们……我想在这座岛上，最后再留下一样东西。你来告诉我吧，你希望有什么呢？”","只要你说出一个词，故事里就会多出一个全新的场景。"]}},"e_bridge":{"t":"连起来的路","x":["奶奶穿上了新内衣，开心地笑了。然后她遵守约定，在海上一步、两步，开始一块一块地放石头，把路连了起来。","济州和大陆第一次连在一起的那天，人们抱在一起跳起了舞。这座岛，再也不孤单了。","在流传下来的故事里，因为少了一匹布，桥没能架成。但在你参与的这个故事里，大家齐心协力，把那一匹补齐了。"]},"e_ninety":{"t":"缺的那一匹","x":["因为少了一匹布，内衣最终没能缝完，奶奶修到一半就停下了。所以据说济州就成了被大海环绕的岛。","也许正因为缺了那一匹，济州独有的风、石头和故事，才得以长长久久地保存下来。","有些故事，正因为有缺憾，才更美。"]},"e_stones":{"t":"五百将军","x":["儿子们不知道妈妈掉进了锅里，回来后吃得津津有味。直到最小的儿子，在锅底发现了妈妈留下的痕迹。","儿子们悲痛欲绝，在汉拿山的灵室溪谷里，就那样僵住，变成了石头。据说现在，五百将军岩依然守在岳的旁边。","奶奶的爱就这样变成了岩石，直到今天还在守护着这座岛。"]},"e_porridge":{"t":"一起煮的粥","x":["五百只碗里盛满了热腾腾的粥，山脚下处处亮起温暖的灯火。儿子们和邻居们吃得饱饱的，围坐在奶奶身边，说说笑笑，聊个不停。","那天，岛明白了一个道理：只要在一起，就算是饥荒的夜晚也会变暖。","这是你亲手一起写下的结局。"]},"e_star":{"t":"用星光连起来的路","x":["最后一匹布，是用夜空的星光织成的。一个好奇的孩子抬头望着天空问：“这根线是从哪儿来的呢？”他顺着一缕星光，把它挂到了织布机上。","奶奶穿上新内衣，笑了起来。桥没有架在海上，而是架向了星河流淌的天空。这条路，既通向大陆，也通向还没去过的遥远岛屿。","那天，济州明白了：好奇心，能铺出一条路。这是你用好奇心打开的隐藏结局。"]},"e_boat":{"t":"自己渡过的海","x":["九十九匹丝绸，始终没能缝成内衣，桥也没能架起来。人们低着头沉默了好一阵子。","这时，有一个人站了出来。“没有桥，我们造船就是了！”丝绸变成了船帆，岳上的树变成了船身。","鼓起勇气的人们乘风破浪，自己抵达了大陆。奶奶挥着手，吹起风，推着船帆前进。这是你用勇气打开的隐藏结局。"]},"e_mountain":{"t":"变成山的奶奶","x":["掉进粥锅的奶奶，再也没能回来。回来的儿子们在锅前哭了很久很久。","他们的眼泪浸湿了大地，奶奶温暖的心就渗进了泥土里。汉拿山深深地呼吸了一次，每座岳上都长出了青青的草。","儿子们没有变成石头，而是变成了守护山的风。据说汉拿山直到今天仍像妈妈的怀抱一样温暖，就是这个缘故。这是你用温暖的心打开的隐藏结局。"]},"e_flavors":{"t":"五百种味道的粥","x":["五百个儿子和邻居们个个都很好奇。“放这个进去会是什么味道呢？”有人放了油菜花，有人放了山茶叶，有人放了从海里捞来的海带，还有人放了酸酸甜甜的橘子。","每一勺粥，味道都不一样。有甜的、香的、咸的，还有清香的。饥荒的夜晚，一下子热闹得像过节。","对新鲜事物的好奇心，做出了最温暖的一桌饭。这是你用好奇心打开的隐藏结局。"]}}};

function localScene(word){
  if(LANG!=="ko")return localSceneL(word);                    // 영어·일본어·중국어 오프라인 장면
  const wt=WORD_TEXT[WORD_ART[String(word).replace(/\s/g,"")]];
  if(wt){const h=[...word].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
    return {source:"local",title:wt[0],paragraphs:wt.slice(1),mood:["dawn","day","golden","dusk","night","mist"][(h>>>4)%6],element:{rainbow:"light",whale:"water",camellia:"flower",tangerine:"light",shootingstar:"star",hareubang:"stone",haenyeo:"water",wind:"wind",hallasan:"stone",baengnokdam:"water"}[WORD_ART[String(word).replace(/\s/g,"")]]}}
  const w=word, h=[...w].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7), pick=(arr,k)=>arr[(h>>>k)%arr.length];
  const el=[[/꽃|동백|유채|수국|벚/,"flower"],[/불|화|해|태양|노을/,"fire"],[/물|바다|비|고래|파도|샘|눈|해녀/,"water"],[/바람|구름|새|연/,"wind"],[/별|달|밤|은하/,"star"],[/돌|바위|산|오름/,"stone"],[/빛|무지개|등/,"light"]]
    .find(([re])=>re.test(w));
  return {source:"local",title:pick([`${w}${josa(w,"이","가")} 깃든 섬`,`할망의 선물, ${w}`,`${w}${josa(w,"이","가")} 찾아온 날`],2),
    paragraphs:[
      pick([`할망이 손끝으로 허공을 가만히 쓸자, 어디선가 ${w}${josa(w,"이","가")} 반짝이며 나타났습니다.`,`할망이 후우 숨을 불자, 바다 위로 ${w}${josa(w,"이","가")} 둥실 떠올랐습니다.`,`할망이 치마폭을 흔들자, 주머니 속에서 ${w}${josa(w,"이","가")} 도르르 굴러 나왔습니다.`],1),
      pick([`${w}${josa(w,"은","는")} 바람을 타고 오름과 오름 사이를 지나 마을 지붕 위에 살포시 내려앉았습니다.`,`${w}${josa(w,"은","는")} 파도 소리에 맞춰 춤을 추며 섬을 한 바퀴 돌았습니다.`,`${w}${josa(w,"은","는")} 한라산 꼭대기까지 올라가 섬 전체를 환하게 비추었습니다.`],3),
      pick([`사람들은 ${w}${josa(w,"을","를")} 올려다보며 “이 섬에는 이런 멋진 일도 있구나” 하고 웃었습니다.`,`아이들은 ${w}${josa(w,"과","와")} 함께 뛰어놀며 오래오래 이 섬을 기억하기로 했습니다.`,`그날 이후 제주 사람들은 ${w}${josa(w,"을","를")} 볼 때마다 설문대할망의 선물을 떠올렸습니다.`],5)],
    mood:pick(["dawn","day","golden","dusk","night","mist"],4),element:el?el[1]:pick(["flower","light","star","wind"],6)};
}

async function fetchWordImage(word){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),100000);
  try{const r=await fetch(`${STORY_API}/story/image?word=${encodeURIComponent(word)}`,{signal:ctl.signal}); if(!r.ok)return null;
    const d=await r.json(); return (d&&typeof d.image==="string"&&d.image.startsWith("data:image/"))?d.image:null}
  catch(e){return null} finally{clearTimeout(timer)}
}
async function makeScene(word){
  const q=new URLSearchParams({word,warm:st.warm,curious:st.curious,brave:st.brave,end:st.end||""});
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(`${STORY_API}/story/scene?${q}`,{signal:ctl.signal}); if(!r.ok) throw new Error(r.status);
    const d=await r.json(); if(!d.title||!Array.isArray(d.paragraphs)||d.paragraphs.length<2) throw new Error("bad");
    return {source:"ai",title:String(d.title),paragraphs:d.paragraphs.map(String).slice(0,3),mood:d.mood,element:d.element};
  }catch(e){return localScene(word)} finally{clearTimeout(timer)}
}

function bal(t){
  if(t.includes("\n"))return t.split("\n").map(esc).join(" <br>");   // 글에 \n 이 있으면 그 자리에서 줄을 바꾼다
  const w=t.split(" ");if(w.length<2||t.length<11)return esc(t);

  for(let i=1;i<w.length;i++){a+=w[i-1].length+(i>1?1:0);const b=t.length-a-1,d=Math.abs(a-b);if(d<=diff){diff=d;best=i}}

  const lbs=hs.map(h=>h.querySelector(".lbl"));lbs.forEach(l=>{l.style.transform="";l._dx=0;l._dy=0});
  const rect=l=>{const r=l.getBoundingClientRect();return{l:r.left,r:r.right,t:r.top,b:r.bottom}};   // 이미 옮긴 값이 반영된 현재 위치

    if(r.l<sr.left+m)l._dx+=sr.left+m-r.l;else if(r.r>sr.right-m)l._dx-=r.r-(sr.right-m);
    if(r.t<sr.top+m)l._dy+=sr.top+m-r.t;else if(r.b>sr.bottom-m)l._dy-=r.b-(sr.bottom-m);put(l)});
  for(let pass=0;pass<4;pass++)for(let i=0;i<lbs.length;i++)for(let j=i+1;j<lbs.length;j++){

/* 그림(3:2) 위의 점을, 화면에 잘려 보이는 무대(stage) 좌표(%)로 바꾸기 */
function bodyToStage(id,px,py){
  const st=$("stage").getBoundingClientRect(); if(!st.width||!st.height) return null;
  const IW=3,IH=2, sw=st.width, sh=st.height;
  const k=Math.max(sw/IW, sh/IH);               // object-fit:cover 배율
  const w=IW*k, h=IH*k;                         // 그림이 그려진 실제 크기
  const f=IMG_FOCUS[id]||[50,0];                // object-position(%)
  const ox=(sw-w)*f[0]/100, oy=(sh-h)*f[1]/100; // 그림이 밀린 정도
  const zx=(window.__kb||1.045);                // 천천히 확대(Ken Burns) 평균 배율
  let x=ox+w*px/100, y=oy+h*py/100;
  const fx=sw*f[0]/100;x=fx+(x-fx)*zx; y=sh*f[1]/100+(y-sh*f[1]/100)*zx; // 확대 기준점(transform-origin)을 반영
  return [x/sw*100, y/sh*100];
}

function findImage(id){ // images/<id>.jpg|png|webp 를 차례로 찾는다. 없으면 false (→ 코드 그림 사용)
  if(!id) return Promise.resolve(false);
  if(id in imgCache) return Promise.resolve(imgCache[id]);
  const IMG_EXT=MP4_IDS.has(id)?["mp4"]:["jpg","png","webp","gif"];
  return new Promise(res=>{let i=0;const next=()=>{
    if(i>=IMG_EXT.length){imgCache[id]=false;return res(false)}
    const ext=IMG_EXT[i++], u=`images/${id}.${ext}`;
    if(ext==="mp4"){const v=document.createElement("video");v.preload="metadata";v.muted=true;   // 움직이는 그림(mp4): 영상 정보가 읽히면 있는 것으로 본다
      v.onloadedmetadata=()=>{imgCache[id]=u;res(u)}; v.onerror=next; v.src=u; return}
    const im=new Image();
    im.onload=()=>{imgCache[id]=u;res(u)}; im.onerror=next; im.src=u};
    next()})}

function splitSentences(t){
  const out=[];let cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];cur+=c;
    if(c==="“"||c==="「")q=true;else if(c==="”"||c==="」")q=false;else if(c==='"')q=!q;
    const T=LANG==="ko"?".":LANG==="en"?".!?":".!?。！？";   // 문장 끝 기호 (일본어·중국어는 공백 없이 이어지는 。！？ 도)
    const gap=LANG==="ja"||LANG==="zh"?true:(i===t.length-1||/\s/.test(t[i+1]));
    const qEnd=LANG!=="ko"&&/[”」"』]/.test(c)&&!q&&T.includes(t[i-1]||"")&&(i===t.length-1||/\s/.test(t[i+1])||LANG==="ja"||LANG==="zh")&&!/^\s*[a-z]/.test(t.slice(i+1));   // 대사가 .”로 끝나는 문장 (바로 뒤에 she said 같은 말이 이어지면 붙인다)
    if(qEnd){out.push(cur.trim());cur="";while(i+1<t.length&&/\s/.test(t[i+1]))i++;continue}
    if(T.includes(c)&&!q&&!(LANG==="en"&&t[i+1]===".")&&gap&&!(/[”」"』]/.test(t[i+1]||"")&&LANG!=="ko")){
      let j=i+1;while(j<t.length&&/[”」"']/.test(t[j])){cur+=t[j];j++;i=j-1}   // 마침표 바로 뒤의 닫는 따옴표는 같은 줄에 붙인다
      out.push(cur.trim());cur="";
      while(i+1<t.length&&/\s/.test(t[i+1]))i++}}
  if(cur.trim())out.push(cur.trim());
  if(LANG!=="ko"){const m=[];out.forEach(x=>{if(m.length&&m[m.length-1].length<(LANG==="en"?14:9))m[m.length-1]+=(LANG==="en"?" ":"")+x;else m.push(x)});return m}   // 의성어 같은 아주 짧은 토막은 다음 문장에 붙인다
  return out}
/* 문장 줄바꿈: 실제 글자 너비를 재서 정한다.
   ① 한 줄에 다 들어가면 그대로.  ② 아니면 따옴표 밖 쉼표 뒤에서 줄을 나누고(한 줄에 들어가는 만큼 이어 붙임),
   ③ 그래도 한 줄에 안 들어가는 부분은 끝 3어절(안 되면 2어절)을 한 덩어리로 묶어 아래 줄로 내린다.
   한 글자 낱말(그, 한, 또 …)은 다음 말에 붙여서 줄 끝에 혼자 남지 않게 한다. */
function bindTail(t){
  const box=$("text"),W=box.clientWidth,NB=" ",nb=x=>x.replace(/ /g,NB);
  const meas=s=>{const m=document.createElement("p");m.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;margin:0;left:0;top:0";m.textContent=s;box.appendChild(m);const w=m.getBoundingClientRect().width;box.removeChild(m);return w};
  t=t.replace(/(^|\s)([가-힣]) /g,"$1$2"+NB);
  t=t.replace(/‘([^’]{1,10})’(?=[가-힣])/g,(m,a)=>"‘"+nb(a)+"’"+String.fromCharCode(8288));   // 짧은 ‘…’ 말은 한 덩어리 (뒤에 붙는 글자와도)
  t=t.split(" ").reduce((o,wd,i,a)=>{const prev=a[i-1];return o+(i?(prev&&/고$/.test(prev)&&/[한운]$/.test(wd)?NB:" "):"")+wd},"");   // 형용사 나열(작고 동글한)은 한 덩어리
  t=t.replace(/(\S) (삼[아고으은])/g,"$1"+NB+"$2");   // '베개 삼아' 같은 말은 한 덩어리
  if(!W||meas(t)<=W)return t;
  const qr=[];t.replace(/“[^”]*”/g,(m,k)=>{qr.push([k,k+m.length,m.length>18]);return m});   // 따옴표 대사 [시작,끝,긴 대사?]
  const inQ=k=>qr.some(r=>k>r[0]&&k<r[1]),inLong=k=>qr.some(r=>r[2]&&k>r[0]&&k<r[1]),endLong=k=>qr.some(r=>r[2]&&r[1]-1===k);
  const segs=[];let st=0;
  for(let k=0;k<t.length;k++){const c=t[k],sp=t[k+1]===" ";
    if(sp&&k+1-st>=7&&((c===","&&(!inQ(k)||inLong(k)))||(c==="…"&&!inQ(k))||(c==="”"&&endLong(k))||(/[.?!]/.test(c)&&inLong(k)))){segs.push(t.slice(st,k+1));st=k+2}}   // 너무 짧은 토막("할망,")은 따로 떼지 않는다
  segs.push(t.slice(st));
  const lines=[];let cur="";
  for(const sg of segs){const trial=cur?cur+" "+sg:sg;if(cur&&meas(trial)>W){lines.push(cur);cur=sg}else cur=trial}

MGT.ko.intro.stars="🏡 <b>집 8채</b>에 모두 불을 켜면 마을이 환해져요!<br>① 하늘에서 떨어지는 별을 <b>눌러서</b> 받아요.<br>② 별을 받으면 집에 <b>불이 하나</b> 켜져요.<br>③ <b>60초 안에</b> 8채를 모두 밝히면 성공!<br>(분홍빛 큰 별은 두 채를 밝혀요)<br>별은 천천히 떨어져요. 서두르지 않아도 돼요.";
MGT.en.intro.stars="🏡 Light all <b>8 houses</b> and the village glows!<br>① <b>Tap</b> the falling stars to catch them.<br>② Each star lights <b>one house</b>.<br>③ Light all 8 within <b>60 seconds</b> to win!<br>(A big pink star lights two.)<br>The stars fall slowly, so no need to rush.";
MGT.ja.intro.stars="🏡 <b>家8軒</b>すべてに明かりをともすと、村が明るくなります！<br>① 落ちてくる星を<b>押して</b>受けとめます。<br>② 受けとめると、家に<b>明かりがひとつ</b>ともります。<br>③ <b>60秒以内</b>に8軒すべて明るくできたら成功！<br>（ピンクの星は2軒）<br>星はゆっくり落ちるので大丈夫です。";
MGT.zh.intro.stars="🏡 点亮全部<b>8座房子</b>，整个村子就会亮起来！<br>① <b>点击</b>落下的星星来接住它。<br>② 每接住一颗星星，就会<b>亮起一盏灯</b>。<br>③ 在<b>60秒内</b>全部点亮就成功！<br>（粉色大星星可以点亮两座）<br>星星落得很慢，不用着急。";

  function card(t,p,note,btns){el("mgCT").textContent=t;el("mgCP").innerHTML=p;el("mgCN").textContent=note||"";el("mgCN").hidden=!note;
    const box=el("mgCB");box.innerHTML="";btns.forEach(b=>{const x=document.createElement("button");x.type="button";x.textContent=b[0];if(b[1])x.className="main";x.onclick=b[2];box.appendChild(x)});

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+len);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+.05)}
